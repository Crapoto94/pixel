<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>PIXEL PANIC — Joueur</title>
<link rel="stylesheet" href="/static/arcade.css" />
<script src="/static/fullscreen.js"></script>
<script src="/static/pacman-render.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  .dpad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:300px; margin:12px auto 0; }
  .dpad button { font-size:30px; padding:18px 0; border:3px solid #000; border-radius:12px;
    background:var(--neon4); color:#fff; box-shadow:0 5px 0 #3a2bd0; }
  .dpad button:active { transform:translateY(4px); box-shadow:0 1px 0 #3a2bd0; }
  .dpad .empty { visibility:hidden; }
  .tbtn { font-size:26px; padding:16px 0; border:3px solid #000; border-radius:12px;
    background:var(--neon4); color:#fff; box-shadow:0 5px 0 #3a2bd0; touch-action:manipulation; }
  .tbtn:active { transform:translateY(4px); box-shadow:0 1px 0 #3a2bd0; }
</style>
</head>
<body class="scanlines">
<div class="wrap" id="app">
  <div class="card center"><span class="pixel blink">CONNEXION…</span></div>
</div>

<script>
const TOKEN = location.pathname.split('/').pop();
const app = document.getElementById('app');
let STATE = null;

function api(path, body) {
  return fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: TOKEN, ...body })
  }).then(r => r.json());
}

// --- Flux temps réel (SSE) + repli en polling si un proxy bufferise le flux ---
let lastSse = 0;
// On ne redessine QUE si l'état a vraiment changé : sinon le polling (~1/s)
// recréerait l'<input> et effacerait le code en cours de frappe + le focus.
let _lastJoueurJson = null;
function applyState(s){
  const j = JSON.stringify(s);
  if (j === _lastJoueurJson) return;
  _lastJoueurJson = j;
  STATE = s; render();
}
const es = new EventSource('/events?token=' + encodeURIComponent(TOKEN));
es.onmessage = (e) => { lastSse = Date.now(); applyState(JSON.parse(e.data)); };
es.onerror = () => { /* l'EventSource se reconnecte tout seul */ };
function poll(){ fetch('/api/state?token=' + encodeURIComponent(TOKEN)).then(r=>r.json()).then(applyState).catch(()=>{}); }
poll(); // rendu immédiat dès le chargement (ne reste pas bloqué sur CONNEXION)
setInterval(() => { if (Date.now() - lastSse > 1500) poll(); }, 1000);

function h(strings, ...vals) { return strings.map((s,i)=>s+(vals[i]??'')).join(''); }
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let pacKey = null;
let mosKey = null;
let videoKey = null, ytReady = false, ytPhone = null;
const PHONE_INTRO = 'Y0r3bg8hKG4';
window.onYouTubeIframeAPIReady = function(){ ytReady = true; };
let tetKey = null;
let tronKey = null;
let g2048Key = null;
let pongKey = null;
let drawKey = null;
let _drawStrokes = [];
let _drawCur = null;
let _drawSendT = null;

// --- Upload photo (input caché, réutilisé) ---
let _photoMissionIdx = 0;
const _photoInput = (() => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const file = inp.files[0]; if (!file) return;
    const btn = document.getElementById('photo-btn-' + _photoMissionIdx);
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Envoi…'; }
    const fd = new FormData();
    fd.append('photo', file);
    fd.append('token', TOKEN);
    fd.append('missionIdx', String(_photoMissionIdx));
    try {
      const r = await fetch('/api/photo/upload', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.ok) poll();
    } catch (_) {}
    inp.value = '';
  });
  return inp;
})();
function uploadPhoto(idx) { _photoMissionIdx = idx; _photoInput.click(); }
function render() {
  if (!STATE) return;
  const me = STATE.me;
  if (!me) { app.innerHTML = `<div class="card center"><h2 class="neon-pink">TOKEN INVALIDE</h2><p>Scanne ton QR code perso.</p></div>`; return; }

  // --- PAC-MAN : contrôleur plein écran ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === 'pacman' && STATE.pacman) {
    renderPacmanPlayer(me); return;
  }
  pacKey = null;
  // --- TETRIS : ma grille + manette ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === 'tetris' && STATE.tetris) {
    renderTetrisPlayer(me); return;
  }
  tetKey = null;
  // --- TRON : manette directionnelle ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === 'tron' && STATE.tron) {
    renderTronPlayer(me); return;
  }
  tronKey = null;
  // --- 2048 : glissements ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === '2048' && STATE.g2048) {
    render2048Player(me); return;
  }
  g2048Key = null;
  // --- PONG : raquette (appui maintenu) ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === 'pong' && STATE.pong) {
    renderPongPlayer(me); return;
  }
  pongKey = null;
  // --- DESSINE-MOI : dessinateur ou devineur ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === 'draw') {
    renderDrawPlayer(me); return;
  }
  drawKey = null;
  // --- MOSAÏQUE : fragment plein écran ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === 'mosaic') {
    renderMosaicPlayer(me); return;
  }
  mosKey = null;
  // --- DIFFUSION VIDÉO : vidéo plein écran + bandeau ---
  if (STATE.phase === 'activity' && STATE.activity && STATE.activity.type === 'videoshow') {
    if (STATE.activity.borneOnly) {
      if (videoKey){ videoKey = null; destroyPhonePlayer(); }
      app.innerHTML = `<div class="card center"><h2>${STATE.activity.topLabel||'📺 VIDÉO'}</h2><p class="muted">Regarde la BORNE.</p></div>` + footer();
      return;
    }
    renderVideoPlayer(me); return;
  }
  if (videoKey){ videoKey = null; destroyPhonePlayer(); } // quitté : coupe le son

  const av = me.avatarInfo;
  const hearts = '❤️'.repeat(me.lives) + '🖤'.repeat(Math.max(0,3-me.lives));

  let html = `
  <div class="card" style="border-color:${av.color}">
    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto;font-size:46px">${av.emoji}</div>
      <div style="flex:1">
        <div class="pixel" style="color:${av.color};font-size:14px">${esc(av.name)}</div>
        <div class="muted">${esc(me.name)}</div>
      </div>
    </div>
    <div class="row mt">
      <div class="hearts">${hearts}</div>
      <div class="coins center">🪙 ${me.coins}</div>
    </div>
    <div class="muted mt" style="font-size:16px">${esc(av.tagline)}</div>
  </div>`;

  // --- Activité BORNE en cours : la page devient une manette ---
  if (STATE.phase === 'activity' && STATE.activity) {
    html += controllerView(STATE.activity);
    app.innerHTML = html + footer();
    return;
  }

  // --- Vote / résultats photo ---
  if (STATE.photoPhase === 'vote') {
    html += photoVoteView(me);
    app.innerHTML = html + footer();
    return;
  }
  if (STATE.photoPhase === 'results') {
    html += `<div class="card center glow-box"><div class="pill neon-yellow">🏆 PALMARÈS PHOTO</div><p class="big">Regarde la BORNE ! 📺</p></div>`;
    html += photoSection(me);
    app.innerHTML = html + footer();
    return;
  }

  // --- Victoire : vidéo anniversaire ---
  if (STATE.phase === 'win') {
    if (STATE.winVideo) {
      html += `<div class="card center glow-box" style="border-color:var(--neon3)">
        <h1 class="neon-yellow pixel">💥 BRAVO !</h1>
        <h2 class="neon-pink">BON ANNIVERSAIRE VINCENT !</h2>
        <div style="margin-top:8px;max-width:100%">
          <div style="position:relative;padding-bottom:56.25%;height:0">
            <div id="phone-win-player" style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:8px"></div>
          </div>
        </div>
      </div>`;
    } else {
      html += `<div class="card center glow-box"><h1 class="neon-yellow pixel">YOU WIN!</h1><p class="big">La réalité a redémarré. 🎉</p></div>`;
    }
  }

  // --- Lobby ---
  if (STATE.phase === 'lobby') {
    html += `
    <div class="card center">
      <h2 class="neon-cyan">SALLE D'ATTENTE</h2>
      <p>La BORNE chauffe… Prépare-toi, ${esc(me.name)}.</p>
      <button class="btn ${me.ready?'secondary':''}" onclick="toggleReady()">
        ${me.ready ? '✔ PRÊT' : 'JE SUIS PRÊT'}
      </button>
    </div>`;
  }

  // --- En jeu : monde courant ---
  if ((STATE.phase === 'world') && STATE.world) {
    const w = STATE.world;
    html += `
    <div class="card glow-box">
      <div class="pill neon-yellow">MONDE ${w.num}/${STATE.worldCount}</div>
      <h2 class="neon-pink">${esc(w.titre)}</h2>
      <p>${esc(w.enigme)}</p>
      <p class="muted">📦 Colis ${w.colis} livré par les Pixels.</p>`;

    if (me.indices) {
      html += `<div class="card" style="background:#1a0b00;border-color:${av.color}">
        <div class="pill" style="color:${av.color}">TON INDICE SECRET</div>
        <ul>${(Array.isArray(me.indices)?me.indices:[me.indices]).filter(Boolean).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
      </div>`;
    }

    if (w.id === 'w1' && me.isHero) {
      html += `<button class="btn secondary mt" onclick="api('/api/hint',{})" style="background:var(--neon4);color:#fff">💡 Demander un indice (vidéo sur la BORNE)</button>`;
    }

    if (!w.resoluParVote && w.code) {
      if (w.heroOnly && !me.isHero) {
        // Énigme réservée au PLAYER ONE : les autres transmettent leurs touches.
        html += `<div class="card" style="border-color:var(--neon3);background:#1a1400">
          <div class="pill neon-yellow">🎮 SÉQUENCE LÉGENDAIRE</div>
          <p>Donne tes touches à <b>VINCENT (Player One)</b> — lui seul peut valider la séquence sur la borne.</p>
        </div>`;
      } else if (w.heroOnly && me.isHero) {
        // PLAYER ONE : une vraie manette pour taper la séquence (Konami).
        html += konamiPadView();
      } else {
        html += `
        <input id="codeInput" type="text" placeholder="CODE" />
        <button class="btn secondary mt" onclick="submitCode()">VALIDER LE CODE</button>
        <div id="codeMsg" class="center mt"></div>`;
      }
    }
    html += `</div>`;
  }

  // --- Panneau Game Master (Vincent éveillé) ou hôte (Marc) ---
  if (me.gameMaster || me.isHost) {
    html += gmPlayerPanel(me);
  }

  // --- Gage en cours ---
  if (STATE.currentGage) html += gageView(STATE.currentGage, me);

  // --- Défis photo (toujours visibles hors activité) ---
  html += photoSection(me);

  app.innerHTML = html + footer();
  // Vidéo anniversaire : initialisation YT Player (autoplay iPad = démarrer muet)
  const _phoneWinId = STATE.winVideo ? (STATE.phase === 'win' ? 'phone-win-player' : 'phone-boss-player') : null;
  if (_phoneWinId && !document.getElementById(_phoneWinId)._pwp) {
    const el = document.getElementById(_phoneWinId);
    if (el) {
      el._pwp = true;
      if (window.YT && YT.Player) {
        new YT.Player(_phoneWinId, {
          height:'100%', width:'100%', videoId: STATE.winVideo,
          playerVars:{ autoplay:1, controls:0, playsinline:1, mute:1, rel:0, modestbranding:1, fs:0 },
          events:{
            onReady(e){ try{ e.target.playVideo(); }catch(_){} },
            onStateChange(e){ if (e.data === YT.PlayerState.PLAYING) { try{ e.target.unMute(); e.target.setVolume(100); }catch(_){} } }
          }
        });
      }
    }
  }
}

function footer() {
  return `<div class="card log"><div class="muted pixel" style="font-size:9px">JOURNAL</div>
    ${(STATE.log||[]).map(l=>`<div>${esc(l.msg)}</div>`).join('')}</div>`;
}

function controllerView(act) {
  // BRIEFING : on invite à regarder la borne
  if (act.type === 'briefing') {
    return `<div class="card center glow-box">
      <div class="pill neon-cyan">📖 BRIEFING</div>
      <h2 class="neon-pink">Regarde la BORNE 📺</h2>
      <p>Le scénario et ton rôle sont en train d'être présentés…</p>
    </div>`;
  }
  // SÉQUENCE MUSICALE : les pads de notes du joueur
  if (act.type === 'music_seq') {
    return musicController(act);
  }
  // QUIZ / BLIND-TEST : QCM (question sur la BORNE, réponse ici)
  if (act.type === 'quiz' || act.type === 'blindtest') {
    return quizController(act);
  }
  // ENQUÊTE : pièces à conviction perso + saisie de code
  if (act.type === 'enquete') {
    return enqueteController(act);
  }
  // BOSS FINAL : manette pour entrer le Konami Code sur la BORNE
  if (act.type === 'boss_final') {
    return bossGamepadView(act);
  }
  // ROUE DES GAGES : détail du défi puis vote du meilleur
  if (act.type === 'roue_des_gages') {
    return roueController(act);
  }
  // REACTION RACE : gros buzzer
  if (act.type === 'reaction_race') {
    const buzzed = (act.buzzes||[]).find(b=>b.id===STATE.me.id);
    return `<div class="card center glow-box">
      <h2 class="neon-cyan">REACTION RACE</h2>
      <p>Regarde la BORNE puis BUZZE !</p>
      <button class="btn-buzz" ${buzzed?'disabled':''} onclick="buzz()">${buzzed?'BUZZÉ ✔':'BUZZ'}</button>
    </div>`;
  }
  if (act.type === 'spotlight') {
    const d = act.data || {};
    const target = d.targetName || '?';
    const isTarget = d.targetId && d.targetId === STATE.me.id;
    // Résultat
    if (act.sub === 'result') {
      const win = act.verdict === 'ok';
      return `<div class="card center glow-box">
        <h2 class="${win?'neon-cyan':'neon-pink'}">${win?'👏 RÉUSSI !':'💀 RATÉ !'}</h2>
        <p><b>${esc(target)}</b> — ${esc(d.defi||'')}</p>
        <p class="muted">👏 ${act.okCount||0} · 💀 ${act.koCount||0}${(!win&&isTarget)?' — tu perds une vie 💔':''}</p>
      </div>`;
    }
    // Phase défi (avant le vote) ou défi en cours
    if (isTarget) {
      return `<div class="card center glow-box" style="border-color:var(--neon3)">
        <h2 class="neon-yellow">🔦 C'EST TON DÉFI !</h2>
        <p class="big">${esc(d.defi||'Relève le défi !')}</p>
        <p class="muted">${act.sub==='vote'?'La salle vote… croise les doigts !':'Relève-le devant tout le monde 🎤'}</p>
      </div>`;
    }
    if (act.sub === 'vote') {
      const my = act.votes && act.votes[STATE.me.id];
      return `<div class="card center glow-box">
        <h2 class="neon-yellow">🔦 VERDICT</h2>
        <p><b>${esc(target)}</b> a tenté : <i>${esc(d.defi||'')}</i></p>
        <p>A-t-il/elle réussi ?</p>
        <div class="row">
          <button class="btn ${my==='ok'?'secondary':''}" onclick="spotlightVote('ok')">RÉUSSI 👏</button>
          <button class="btn ${my==='ko'?'danger':''}" onclick="spotlightVote('ko')">RATÉ 💀</button>
        </div>
        ${my?'<p class="neon-cyan mt">Vote enregistré ✔ (modifiable)</p>':''}
      </div>`;
    }
    return `<div class="card center glow-box">
      <h2 class="neon-yellow">🔦 SPOTLIGHT</h2>
      <p><b>${esc(target)}</b> relève un défi…</p>
      <p class="muted">${esc(d.defi||'')}</p>
      <p class="muted">Regarde, tu voteras juste après ! 👀</p>
    </div>`;
  }
  return `<div class="card center"><h2>ACTIVITÉ EN COURS</h2><p>Regarde la BORNE.</p></div>`;
}

function renderVideoPlayer(me) {
  if (videoKey === STATE.activity.startedAt) return; // une seule fois (sinon la vidéo redémarre)
  videoKey = STATE.activity.startedAt;
  const a = STATE.activity;
  app.innerHTML = `
    <div class="center">
      <div style="background:#d40000;color:#fff;font-family:var(--pixel);font-size:13px;padding:7px 12px;border-radius:6px;display:inline-block" class="blink">${a.topLabel||'📺 VIDÉO'}</div>
      <div style="position:relative;margin:8px auto 0;border:3px solid #ff2e88;border-radius:10px;overflow:hidden;background:#000;max-width:340px">
        <div style="aspect-ratio:9/16"><div id="videoplayer" style="width:100%;height:100%"></div></div>
        ${a.chyron?`<div style="position:absolute;left:0;right:0;bottom:0;background:rgba(212,0,0,.92);color:#fff;
          font-family:var(--pixel);font-size:11px;line-height:1.5;padding:8px;text-align:center">${a.chyron}</div>`:''}
      </div>
      ${a.footer?`<p class="muted" style="font-size:13px">${a.footer}</p>`:''}
    </div>`;
  phoneShowStart(a.intro || PHONE_INTRO, a.video || '7kyY29BHTZs');
}
function destroyPhonePlayer(){ try { if (ytPhone) { ytPhone.destroy(); ytPhone = null; } } catch(_){ ytPhone = null; } }
// Sting d'intro (son à fond) puis vidéo principale en boucle, sur le téléphone.
function phoneShowStart(intro, main){
  if (!(window.YT && YT.Player)){ // pas d'API : on joue directement la vidéo principale
    const el = document.getElementById('videoplayer');
    if (el) el.outerHTML = `<iframe width="100%" height="100%" style="border:0"
      src="https://www.youtube.com/embed/${main}?autoplay=1&playsinline=1&loop=1&playlist=${main}&rel=0"
      allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
    return;
  }
  destroyPhonePlayer();
  ytPhone = new YT.Player('videoplayer', {
    height:'100%', width:'100%', videoId: intro,
    playerVars:{ autoplay:1, controls:0, playsinline:1, mute:1, rel:0, modestbranding:1, fs:0 },
    events:{
      onReady(e){ try{ e.target.playVideo(); }catch(_){} },
      onStateChange(e){
        if (e.data === YT.PlayerState.PLAYING) { try{ e.target.unMute(); e.target.setVolume(100); }catch(_){} }
        if (e.data === YT.PlayerState.ENDED){
          if (!ytPhone._main){ ytPhone._main = true; try{ e.target.loadVideoById(main); e.target.unMute(); e.target.setVolume(100); }catch(_){} }
          else { try{ e.target.seekTo(0, true); e.target.playVideo(); }catch(_){} }
        }
      }
    }
  });
}

function mosaicGuessSend(){
  const inp=document.getElementById('mosans'); if(!inp) return;
  const txt=inp.value.trim(); if(!txt) return;
  api('/api/mosaic/guess', { text: txt }).then(r=>{ const fb=document.getElementById('mosfb');
    if(fb) fb.innerHTML = (r&&r.correct)?'<span class="neon-cyan">🎉 BONNE RÉPONSE !</span>':`<span class="neon-pink">Raté… ${r&&r.wrong?'('+r.wrong+' erreur(s))':''}</span>`;
    if(!(r&&r.correct)) inp.value='';
  });
}
function renderMosaicPlayer(me) {
  const a = STATE.activity;
  const mine = a.mine;
  const key = (a.round||1) + '-' + (mine ? mine.slice : 'x') + '-' + (a.reveal?1:0) + '-' + (a.solved?'s':'') + (a.failed?'f':'');
  if (mosKey === key) return; // statique : on ne redessine pas à chaque SSE
  mosKey = key;
  // Résolu / échoué : on affiche le résultat (le mot)
  if (a.solved || a.failed){
    app.innerHTML = `<div class="card center glow-box">
      <h2 class="${a.solved?'neon-cyan':'neon-pink'}">${a.solved?'✅ RÉSOLU !':'⏱ Réponse révélée'}</h2>
      <div class="big pixel neon-yellow" style="letter-spacing:6px">${esc(a.answer||'')}</div>
      ${a.solved&&a.solvedBy?`<p class="muted">Trouvé par ${esc(a.solvedBy)}</p>`:''}
      <p class="muted">Regarde la BORNE 📺</p>
    </div>`;
    return;
  }
  if (!mine) { app.innerHTML = `<div class="card center"><h2 class="neon-cyan">🧩 MOSAÏQUE</h2><p>En attente…</p></div>`; return; }
  const rows = mine.rows || 1;
  const bandH = Math.max(70, Math.min(150, Math.floor((window.innerHeight - 96) / rows)));
  const bands = (mine.bands || []).map((s, r) => {
    const ok = r === mine.correctRow;
    const bg = ok ? `hsl(${mine.hue},85%,32%)` : '#0a0a14';
    const col = ok ? '#ffe600' : '#3a3a52';
    const sh = ok ? 'text-shadow:0 0 10px #000' : '';
    return `<div style="height:${bandH}px;display:flex;align-items:center;justify-content:center;background:${bg};border-bottom:2px solid #000;font-family:var(--pixel);font-size:${Math.floor(bandH*0.42)}px;color:${col};letter-spacing:8px;${sh}">${esc(s)}</div>`;
  }).join('');
  const hint = rows > 1
    ? (a.reveal
        ? `La ligne <b style="color:#ffe600">colorée</b> est la bonne. Décale ton téléphone (en escalier) pour l'aligner avec celles des voisins.`
        : `UNE seule des ${rows} lignes est la bonne. Trouvez-la en équipe et placez-vous en quinconce. <span class="muted">(le MJ peut révéler un indice couleur)</span>`)
    : `Place-toi au bon endroit dans la rangée pour reconstituer le mot.`;
  app.innerHTML = `
    <div class="center">
      <div class="pixel neon-cyan" style="font-size:12px;margin:4px">🧩 ${rows>1?'ALIGNE EN QUINCONCE':'ALIGNE TON ÉCRAN'}</div>
      <div style="border:2px solid #222;border-radius:8px;overflow:hidden;margin:0 auto;max-width:520px">${bands}</div>
      <p class="muted" style="font-size:14px;margin-top:8px">${hint}</p>
      <div class="card" style="border-color:var(--neon3);margin-top:8px">
        <div class="pill neon-yellow">🔤 VOTRE RÉPONSE</div>
        <div class="row mt">
          <input id="mosans" type="text" placeholder="Le mot reconstitué…" style="flex:1" />

let _pongHold = null;
function pongHold(dir){ pongRelease(); pongMoveOnce(dir); _pongHold = setInterval(()=>pongMoveOnce(dir), 70); }
function pongRelease(){ if(_pongHold){ clearInterval(_pongHold); _pongHold=null; } }
function pongMoveOnce(dir){ api('/api/pong/move', { dir }); }
function pongDrawJ(ctx, S, t, mineSide){
  const k=S/t.size; ctx.fillStyle='#05010f'; ctx.fillRect(0,0,S,S);
  ctx.strokeStyle='#1b1060'; ctx.lineWidth=2; ctx.strokeRect(2,2,S-4,S-4);
  const m=t.margin*k, pad=t.pad*k;
  t.players.forEach(p=>{ if(!p.alive)return; ctx.fillStyle=p.color; const c=p.pos*k;
    if(p.side==='top') ctx.fillRect(c-pad/2,m-3,pad,6);
    if(p.side==='bottom') ctx.fillRect(c-pad/2,S-m-3,pad,6);
    if(p.side==='left') ctx.fillRect(m-3,c-pad/2,6,pad);
    if(p.side==='right') ctx.fillRect(S-m-3,c-pad/2,6,pad);
    if(p.side===mineSide){ ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      if(p.side==='top') ctx.strokeRect(c-pad/2-1,m-5,pad+2,9);
      if(p.side==='bottom') ctx.strokeRect(c-pad/2-1,S-m-5,pad+2,9);
      if(p.side==='left') ctx.strokeRect(m-5,c-pad/2-1,9,pad+2);
      if(p.side==='right') ctx.strokeRect(S-m-5,c-pad/2-1,9,pad+2);
    }
  });
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(t.ball.x*k,t.ball.y*k,t.ballr*k,0,7); ctx.fill();
}
function renderPongPlayer(me){
  const t = STATE.pong;

    else if (mine && !mine.alive) info.innerHTML='<span class="neon-pink">💀 ÉLIMINÉ — regarde la borne !</span>';

  }
}

// =================== DESSINE-MOI (manette joueur) ===================
function drawStrokesJ(ctx, W, H, strokes){
  ctx.fillStyle='#fdf6e3'; ctx.fillRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const s of (strokes||[])){ const pts=s.p||[]; if(!pts.length) continue;
    ctx.strokeStyle=s.c||'#160a2e'; ctx.lineWidth=(s.w||3);
    ctx.beginPath(); ctx.moveTo(pts[0][0]*W, pts[0][1]*H);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*W, pts[i][1]*H);
    if(pts.length===1) ctx.lineTo(pts[0][0]*W+0.1, pts[0][1]*H+0.1);
    ctx.stroke();
  }
}
function drawSendNow(){ api('/api/draw/update', { strokes: _drawStrokes }); }
function drawSendThrottled(){ if(_drawSendT) return; _drawSendT=setTimeout(()=>{ _drawSendT=null; drawSendNow(); }, 120); }

      const redraw=()=>drawStrokesJ(cv.getContext('2d'), cv.width, cv.height, _drawStrokes);

      cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);

      if(gi) gi.addEventListener('keydown',(e)=>{ if(e.key==='Enter') drawGuessSend(); });
    }

  const cv=document.getElementById('drawcvj');

    else st.innerHTML = `<span class="neon-pink">✏️ ${esc(a.drawerName)} dessine</span> — ${a.wordLen} lettres (${esc(a.category||'')})`;
  }
}

    if(s.st==='done') return `<span class="mslot" style="background:${s.color};color:#111">${esc(s.label)}</span>`;
    if(s.st==='hint') return `<span class="mslot" style="border-color:${s.color};color:${s.color}">${esc(s.label)}</span>`;
    return `<span class="mslot mhidden">?</span>`;
  }).join('');
  const pads = (act.pads||[]).map(p=>
    `<button class="mpad" style="background:${p.color}" onclick="musicPress(${p.index},${p.freq})">${esc(p.label)}</button>`
  ).join('');
  const win = act.status==='win';
  return `<div class="card center glow-box">
    <div class="pill neon-pink">🎵 SÉQUENCE MUSICALE</div>
    <div class="mrow mt">${slots}</div>
    <p class="muted">${act.step}/${act.len}${win?' — <span class="neon-yellow">RÉUSSI !</span>':(act.wrongAt?' — <span class="neon-pink">raté, on reprend</span>':'')}</p>
    <p>${pads?'Ta/tes note(s) — joue au bon moment :':'<span class="muted">Tu observes la borne…</span>'}</p>
    <div class="mpadrow">${pads}</div>
  </div>`;
}
function musicPress(index, freq){ if(window.SFX){ SFX.unlock(); SFX.note(freq); } api('/api/music/press', { index }); }

function roueController(act){

      <h2 class="neon-pink">🎰 LA ROUE TOURNE…</h2>

    return `<div class="card center glow-box" style="border-color:var(--neon3)">
      <div class="pill neon-yellow">🎰 DÉFI À RELEVER</div>
      <h2 class="neon-pink">${esc(g.titre||'')}</h2>
      <p class="big">${esc(g.desc||'')}</p>
      ${g.alt && g.alt!=='—' ? `<p class="muted">Variante sans alcool : ${esc(g.alt)}</p>`:''}

    </div>`;
  }

    return `<div class="card glow-box">
      <div class="pill neon-yellow">🗳️ LE MEILLEUR SUR « ${esc(g.titre||'')} »</div>
      <p class="muted">Vote pour celui/celle qui a le mieux relevé le défi (pas toi-même).</p>
      <div class="grid-players mt">
        ${others.map(p=>`<button class="btn ${my===p.id?'secondary':'warn'}" onclick="roueVote('${p.id}')">${esc(p.name)}${my===p.id?' ✔':''}</button>`).join('')}

    <h2 class="${iWon?'neon-cyan':'neon-pink'}">${iWon?'🏆 TU GAGNES UNE VIE ❤️':'💔 −1 vie'}</h2>
    <p class="big">${winners.length?esc(winners.map(id=>(STATE.players.find(p=>p.id===id)||{}).name).filter(Boolean).join(' & ')):'—'} : meilleur(s) sur « ${esc(g.titre||'')} »</p>
    <p class="muted">Regarde la BORNE 📺</p>

function roueVote(t){ api('/api/roue/vote', { targetId: t }); }

function enqueteController(act) {
  if (act.done) {
    const f = act.finale || {};
    return `<div class="card center glow-box" style="border-color:var(--neon3)">
      <div class="pill neon-yellow">🔓 AFFAIRE RÉSOLUE</div>
      <h2 class="neon-pink">${esc(f.culprit||'')}</h2>
      <p>${esc(f.mobile||'')}</p>
      <p class="muted">Regarde la BORNE 📺</p>
    </div>`;
  }
  const a = act.act || {};
  if (_enqActSeen !== a.num) { _enqActSeen = a.num; _enqDraft = ''; } // nouvel acte → on vide le brouillon
  const frags = (act.myFragments||[]).map(f=>`
    <div style="border:2px solid var(--neon3);border-radius:10px;padding:10px;margin:8px 0;background:#1a1400">
      <div class="pill neon-yellow" style="font-size:11px">${esc(f.label||'PIÈCE')}</div>
      <div style="font-size:15px;margin-top:4px">${esc(f.text||'')}</div>
    </div>`).join('');
  const wrong = act.lastWrong && (Date.now()-act.lastWrong < 3000)
    ? '<p class="pixel" style="font-size:11px;color:var(--danger)">✘ Code refusé — recoupez encore !</p>' : '';
  return `<div class="card glow-box">
    <div class="pill neon-pink">🕵️ ENQUÊTE — ACTE ${a.num}/${act.total}</div>
    <h2 class="neon-cyan">${esc(a.title||'')}</h2>
    <p class="muted" style="font-size:13px">📍 ${esc(a.place||'')}</p>
    <p style="font-size:15px"><b class="neon-pink">Énigme :</b> ${esc(a.riddle||'')}</p>
    ${frags ? `<div class="pill neon-cyan mt">🔍 TES PIÈCES À CONVICTION</div>${frags}
      <p class="muted" style="font-size:12px">Partage-les à voix haute avec la table : seule l'addition de toutes les pièces donne le code.</p>`
      : (act.fragVisible
          ? `<p class="muted mt">Tu n'as pas de pièce sur cet acte — écoute les autres et aide à trouver le code. 👂</p>`
          : `<p class="muted mt">🔒 Les pièces à conviction ne sont pas encore distribuées — attends le signal du maître du jeu.</p>`)}
    <input id="enqCode" type="text" placeholder="CODE DE L'ACTE" style="text-transform:uppercase"
      value="${esc(_enqDraft)}" oninput="_enqDraft=this.value" onkeydown="if(event.key==='Enter')enqueteCode()" autocomplete="off" />
    <button class="btn warn mt" onclick="enqueteCode()">🔓 VALIDER LE CODE</button>
    <div id="enqMsg" class="center mt">${wrong}</div>
  </div>`;
}
// brouillon de code conservé entre les rendus ; réinitialisé à chaque acte
let _enqDraft = '';
let _enqActSeen = null;
function enqueteCode(){
  const el = document.getElementById('enqCode');
  const v = el ? el.value : '';
  _enqDraft = v;
  api('/api/enquete/code', { code: v }).then(r=>{
    const m = document.getElementById('enqMsg');
    if (r.ok) { _enqDraft = ''; }
    if (m) m.innerHTML = r.ok
      ? '<span class="neon-cyan pixel" style="font-size:11px">✔ ACTE DÉBLOQUÉ !</span>'
      : `<span class="pixel" style="font-size:10px;color:var(--danger)">${esc(r.reason||'NON')}</span>`;
    poll();
  });
}

function quizController(act) {
  const letters = ['A','B','C','D','E'];
  const title = act.type==='blindtest' ? '🎵 BLIND-TEST' : '❓ QUIZ';
  // Fin de manche blind-test : classement + perdant
  if (act.sub === 'final') {
    const board = act.finalBoard || [];
    const losers = act.loserNames || [];
    const winners = act.winnerNames || [];
    const iLost = losers.length && board.some(b=>b.id===STATE.me.id && losers.includes(b.name));
    return `<div class="card glow-box">
      <div class="pill neon-yellow">🏁 BLIND-TEST TERMINÉ</div>
      ${winners.length ? `<p class="center neon-cyan mt">🏆 Vainqueur : ${winners.map(esc).join(' & ')}</p>` : ''}
      <div class="leaderboard mt">
        ${board.map((p,i)=>`<div>${['🥇','🥈','🥉'][i]||(i+1+'.')} ${esc(p.name)} <span class="coins">${p.pts} pts</span></div>`).join('')}
      </div>
      ${losers.length
        ? `<p class="center mt ${iLost?'neon-pink':''}">💔 ${losers.map(esc).join(', ')} perd une vie${iLost?' (toi !)':''}</p>`
        : `<p class="center muted mt">Égalité — personne ne perd de vie.</p>`}
    </div>`;
  }
  const reveal = act.sub === 'reveal';
  const my = act.myAnswer;
  const choices = (act.choices||[]).map((c,i)=>{
    let cls = 'btn';
    if (reveal) {
      if (i === act.answer) cls = 'btn secondary';        // bonne réponse
      else if (i === my) cls = 'btn danger';              // mon erreur
      else cls = 'btn';
    } else if (i === my) {
      cls = 'btn warn';                                   // mon choix verrouillé
    }
    const dis = (reveal || my!==null) ? 'disabled' : '';
    return `<button class="${cls}" ${dis} onclick="answer(${i})">${letters[i]}. ${esc(c)}</button>`;
  }).join('');

  let status = '';
  if (reveal) {
    const good = my !== null && my === act.answer;
    status = my===null ? '<p class="muted">Pas de réponse… 😬</p>'
      : good ? '<p class="neon-cyan pixel" style="font-size:12px">✔ BONNE RÉPONSE !</p>'
             : '<p class="pixel" style="font-size:11px;color:var(--danger)">✘ Raté !</p>';
  } else if (my !== null) {
    status = '<p class="neon-cyan">Réponse enregistrée. Regarde la BORNE…</p>';
  } else {
    status = '<p>Question ' + (act.qIndex+1) + '/' + act.total + ' — réponds vite !</p>';
  }

  return `<div class="card glow-box">
    <div class="pill neon-cyan">${title} — Q${act.qIndex+1}/${act.total}</div>
    <h2 class="neon-pink">${esc(act.prompt)}</h2>
    ${act.type==='blindtest' && !reveal ? '<p class="muted">🔊 Écoute l’extrait joué sur la BORNE.</p>':''}
    <div>${choices}</div>
    <div class="center mt">${status}</div>
  </div>`;
}

// --- Défis photo ---
function photoSection(me) {
  const missions = me.photoMissions || [];
  const done = me.myPhotos || [];
  const items = missions.map((m, i) => {
    const up = done.find(p => p.missionIdx === i);
    return `<div style="border:2px solid ${up ? 'var(--ok)' : '#ffffff22'};border-radius:10px;padding:10px;margin:8px 0;background:#021018">
      ${up ? `<img src="${esc(up.url)}" style="width:100%;max-height:110px;object-fit:cover;border-radius:6px;margin-bottom:6px">` : ''}
      <div style="font-size:13px;color:${up ? 'var(--ok)' : 'var(--neon2)'}"><b>${esc(m.label)}</b>${up ? ' ✓' : ''}</div>
      <div class="muted" style="font-size:12px;margin:4px 0 8px">${esc(m.desc)}</div>
      <button id="photo-btn-${i}" class="btn ${up ? '' : 'warn'}" style="font-size:11px;width:100%" onclick="uploadPhoto(${i})">

  }).join('');
  return `<div class="card" style="border-color:var(--neon2)">

}

function photoVoteView(me) {
  const photos = (STATE.photos || []).filter(p => p.playerId !== me.id);

  if (!photos.length) return `<div class="card center"><div class="pill neon-yellow">📸 VOTE PHOTO</div><p>Pas encore de photos à voter…</p></div>`;

    const bv = myVotes.belle === p.id, rv = myVotes.rigolote === p.id;

      <img src="${esc(p.url)}" style="width:100%;max-height:160px;object-fit:cover;border-radius:6px;margin-bottom:6px">
      <div style="font-size:13px"><b>${esc(p.playerName)}</b> — <span class="muted">${esc(p.missionLabel)}</span></div>
      <div class="row mt" style="gap:8px">

// --- Manette « séquence légendaire » (Konami) pour le PLAYER ONE ---
let _konamiSeq = []; // [{sym, tok}]
function konamiDisplay(){
  return _konamiSeq.length
    ? _konamiSeq.map(x=>`<span style="margin:0 3px">${esc(x.sym)}</span>`).join('')
    : '<span class="muted" style="font-size:14px;letter-spacing:0">— séquence vide —</span>';
}
function konamiPadView(){
  return `<div class="card glow-box" style="border-color:var(--neon3);background:#1a1400">
    <div class="pill neon-yellow">🎮 SÉQUENCE LÉGENDAIRE — PLAYER ONE</div>
    <p class="muted" style="font-size:13px">Rassemble les touches de tout le monde et tape la séquence. Toi seul peux valider.</p>
    <div id="konamiDisplay" class="center" style="min-height:40px;font-size:30px;color:#ffe600;background:#03010a;border:2px solid var(--neon4);border-radius:8px;padding:6px;margin:8px 0">${konamiDisplay()}</div>
    <div class="dpad" style="max-width:240px">
      <div class="empty"></div><button onclick="konamiPress('↑','HAUT')">▲</button><div class="empty"></div>
      <button onclick="konamiPress('←','GAUCHE')">◄</button><div class="empty"></div><button onclick="konamiPress('→','DROITE')">►</button>
      <div class="empty"></div><button onclick="konamiPress('↓','BAS')">▼</button><div class="empty"></div>
    </div>
    <div class="row" style="gap:10px;justify-content:center;margin-top:10px">
      <button class="btn" style="background:#ff2e88;color:#fff;max-width:90px" onclick="konamiPress('B','B')">B</button>
      <button class="btn" style="background:#38ff9c;color:#03010a;max-width:90px" onclick="konamiPress('A','A')">A</button>
    </div>
    <div class="row mt" style="gap:8px">
      <button class="btn" onclick="konamiBack()">⌫</button>
      <button class="btn danger" onclick="konamiClear()">Effacer</button>
      <button class="btn secondary" onclick="konamiSubmit()">👑 VALIDER</button>
    </div>
    <div id="codeMsg" class="center mt"></div>
  </div>`;
}
function konamiRefresh(){ const el = document.getElementById('konamiDisplay'); if (el) el.innerHTML = konamiDisplay(); }
function konamiPress(sym, tok){
  _konamiSeq.push({ sym, tok });
  if (window.SFX && SFX.pad) { try { SFX.unlock(); SFX.pad(_konamiSeq.length % 4); } catch(_){} }
  konamiRefresh();
}
function konamiBack(){ _konamiSeq.pop(); konamiRefresh(); }
function konamiClear(){ _konamiSeq = []; konamiRefresh(); }
function konamiSubmit(){
  const code = _konamiSeq.map(x=>x.tok).join(' ');
  api('/api/code', { code }).then(r=>{
    const m = document.getElementById('codeMsg');
    if (m) m.innerHTML = r.ok ? '<span class="neon-cyan pixel" style="font-size:11px">✔ SÉQUENCE VALIDÉE !</span>'
                              : `<span class="pixel" style="font-size:10px;color:var(--danger)">${esc(r.reason||'NON')}</span>`;
    if (r.ok) _konamiSeq = [];
  });
}
function gmGage(){
  const t = document.getElementById('gmTarget').value;
  api('/api/gm/gage', { targetId: t });
}
