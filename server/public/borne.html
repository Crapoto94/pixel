<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIXEL PANIC — BORNE</title>
<link rel="stylesheet" href="/static/arcade.css" />
<script src="/static/sound.js"></script>
<script src="/static/fullscreen.js"></script>
<script src="/static/pacman-render.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  #soundhint { position: fixed; top: 8px; left: 8px; z-index: 100000; cursor: pointer;
    background: rgba(3,1,10,.7); color: var(--neon3); border: 2px solid var(--neon3);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  body { font-size: 28px; }
  .stage { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .big { font-size: 56px; }
  .huge { font-size: 90px; }
  .ticker { position: fixed; bottom: 0; left: 0; right: 0; background:#000; border-top:3px solid var(--neon);
            white-space: nowrap; overflow: hidden; }
  .ticker span { display: inline-block; padding: 10px 0; font-family: var(--pixel); font-size: 16px;
            color: var(--neon3); animation: scroll 24s linear infinite; }
  @keyframes scroll { from { transform: translateX(100%);} to { transform: translateX(-100%);} }
  .leaderboard div { font-size: 30px; padding: 8px; border-bottom: 1px solid #fff2; }
  .hpbar { height: 34px; background:#300; border:3px solid #000; border-radius:6px; overflow:hidden; }
  .hpbar > div { height:100%; background:linear-gradient(90deg,var(--danger),var(--neon3)); transition:width .3s; }
  .wheel { font-size: 70px; }
  .qchoice { font-size: 30px; padding: 14px 18px; margin: 10px 0; border:3px solid #fff3;
             border-radius:10px; box-shadow:0 4px 0 #0008; }
  .padgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; max-width:560px;
             margin:18px auto; }
  .pad { aspect-ratio:1; border-radius:20px; border:6px solid #000; cursor:pointer;
         box-shadow:0 8px 0 #0009; transition:filter .1s, transform .05s; filter:brightness(.45); }
  .pad.lit { filter:brightness(1.6); }
  .pad:active { transform:translateY(4px); }
  .pad0{background:#ff2e88} .pad1{background:#2effd5} .pad2{background:#7a5cff} .pad3{background:#ffe600}
</style>
</head>
<body class="scanlines">
<div id="yt-amb" style="position:fixed;width:1px;height:1px;top:-9px;left:-9px"></div>
<div id="yt-bt"  style="position:fixed;width:1px;height:1px;top:-9px;left:-9px"></div>
<div id="soundhint" class="pixel">🔊 Activer le son</div>
<div class="stage" id="stage"><div class="center huge pixel blink">INSERT COIN</div></div>
<div class="ticker"><span id="ticker">PIXEL PANIC — la réalité a buggé…</span></div>

<script>
const stage = document.getElementById('stage');
const tickerEl = document.getElementById('ticker');
let STATE = null;

let lastSse = 0;
function applyState(s){ STATE = s; detectSounds(STATE); detectMusic(STATE); syncYT(STATE); syncBlindtest(STATE); render(); }
const es = new EventSource('/events');
es.onmessage = (e) => { lastSse = Date.now(); applyState(JSON.parse(e.data)); };
function pollBorne(){ fetch('/api/state').then(r=>r.json()).then(applyState).catch(()=>{}); }
pollBorne();
setInterval(() => { if (Date.now() - lastSse > 1500) pollBorne(); }, 1000);
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// --- Activation du son au 1er clic n'importe où (obligatoire sur navigateur) ---
let SOUND_ON = false;
function enableSound(){
  if (SOUND_ON) return;
  if (window.SFX) { SFX.unlock(); SFX.coin(); }
  SOUND_ON = true;
  const h = document.getElementById('soundhint'); if (h) h.style.display = 'none';
  if (ytAmb) { try { ytAmb.unMute(); } catch(_){} } // déjà en train de jouer, on retire juste le mute
  else initYT(); // API pas encore prête, on démarre normalement
}
document.getElementById('soundhint').addEventListener('click', enableSound);
['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, enableSound, { once: false }));

// --- Déclenche les bruitages sur les transitions d'état ---
let _p = { phase: null, world: null, gageId: null, act: null, sub: null };
function detectSounds(s){
  if (!SOUND_ON || !window.SFX) return;
  const w = s.world ? s.world.num : null;
  const act = s.activity ? s.activity.type : null;
  const sub = s.activity ? s.activity.sub : null;
  const gageId = s.currentGage ? (s.currentGage.id + '-' + (s.currentGage.at || '')) : null;
  if (_p.phase === null) { _p = { phase: s.phase, world: w, gageId, act, sub }; return; }
  try {
    if (s.phase === 'win' && _p.phase !== 'win') SFX.win();
    else if (s.phase === 'world' && _p.phase === 'lobby') SFX.start();
    else if (w && w !== _p.world) { (s.world && s.world.isTwist) ? SFX.twist() : SFX.level(); }
    if (s.phase === 'vote' && _p.phase !== 'vote') SFX.vote();
    if (act && act !== _p.act) SFX.start();
    if ((act === 'quiz' || act === 'blindtest') && sub === 'reveal' && _p.sub !== 'reveal') SFX.correct();
    if (gageId && gageId !== _p.gageId) SFX.gage();
  } catch (_) {}
  _p = { phase: s.phase, world: w, gageId, act, sub };
}

let kidsKey = null;
let pacKey = null;
let pacEventSeen = 0;
let briefKey = null, briefTimer = null, briefSlides = null, briefIdx = 0;
function render(){
  if(!STATE) return;
  // Nettoyage du briefing si on en sort
  if (briefTimer && !(STATE.activity && STATE.activity.type==='briefing')){
    clearInterval(briefTimer); briefTimer = null; briefKey = null;
  }
  // --- BRIEFING : déroulé scénario + attendus par joueur ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='briefing'){
    setupBriefing(); return;
  }
  // --- PAC-MAN : prend le contrôle de la borne ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='pacman' && STATE.pacman){
    renderPacmanBorne(); return;
  }
  pacKey = null;
  // --- Séquence musicale ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='music_seq'){
    renderMusicBorne(STATE.activity); return;
  }
  // --- Enquête collaborative (Cold Case Saint-Maur) ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='enquete'){
    renderEnqueteBorne(STATE.activity); return;
  }
  // --- Mosaïque de téléphones ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='mosaic'){
    const a = STATE.activity;
    stage.innerHTML = `<div class="center">
      <h1 class="big neon-cyan">🧩 MOSAÏQUE</h1>
      <p class="big">Posez vos <b>${a.n}</b> téléphones côte à côte,<br>dans le BON ORDRE, pour reconstituer le mot secret.</p>
      <div class="huge">📱📱📱</div>
      <p class="muted">Indice : le bandeau de couleur en bas des écrans doit former un dégradé continu.</p>
      <p class="big neon-yellow">Puis tapez le mot ci-dessous 👇 (ou sur un téléphone).</p>
    </div>`;
    tickerEl.textContent = 'MOSAÏQUE — alignez vos téléphones !';
    return;
  }
  // --- Défi des enfants : prend le contrôle de la borne (insensible au SSE) ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='pixel_pad'){
    if (kidsKey !== STATE.activity.startedAt){ kidsKey = STATE.activity.startedAt; buildKidsPad(); }
    tickerEl.textContent = "LES PIXELS À L'HONNEUR — Robin & Juliette !";
    return;
  }
  kidsKey = null;

  // --- Galerie photo (vote ou résultats) ---
  if (STATE.photoPhase) { renderPhotoBorne(); return; }

  const connected = STATE.players.filter(p=>p.connected).length;
  let html = '';

  if (STATE.phase === 'lobby') {
    html = `
      <div class="center">
        <div class="huge pixel neon-pink blink">INSERT COIN</div>
        <p class="big">Scanne ton QR pour rejoindre la partie</p>
        <div class="grid-players mt">
          ${STATE.players.map(p=>`<div class="pcard ${p.connected?'':'off'}">
            <div class="emoji">${avatarEmoji(p.avatar)}</div>
            <div>${esc(p.name)}</div>
            <div class="pill ${p.ready?'neon-cyan':''}">${p.connected?(p.ready?'PRÊT':'…'):'OFF'}</div>
          </div>`).join('')}
        </div>
        <p class="muted mt">${connected} joueur(s) connecté(s)</p>
      </div>`;
  }

  else if (STATE.phase === 'activity' && STATE.activity) {
    html = activityView(STATE.activity);
  }

  else if (STATE.phase === 'vote') {
    html = `<div class="center">
      <h1 class="big neon-pink">🗳️ DÉMASQUEZ LE GLITCH</h1>
      <p class="big">Votez sur vos téléphones…</p>
      <div class="wheel">🐛❓</div>
    </div>`;
  }

  else if (STATE.phase === 'win') {
    html = `<div class="center glow-box">
      <div class="huge pixel neon-yellow">YOU&nbsp;WIN!</div>
      <p class="big">La réalité a redémarré. 🎉</p>
      <div class="mt">${highScore()}</div>
    </div>`;
  }

  else if (STATE.world) {
    const w = STATE.world;
    html = `<div>
      ${w.isTwist ? `<div class="center huge pixel neon-yellow glow-box">⚡ PLAYER ONE ⚡</div>`:''}
      <div class="pill neon-yellow">MONDE ${w.num}/${STATE.worldCount}</div>
      <h1 class="big neon-pink">${esc(w.titre)}</h1>
      <p>${esc(w.intro)}</p>
      ${STATE.currentGage ? gageBanner(STATE.currentGage) : ''}
      <div class="mt">${scoresStrip()}</div>
    </div>`;
  }

  stage.innerHTML = html;
  tickerEl.textContent = (STATE.log||[]).map(l=>l.msg).join('   ◆   ') || 'PIXEL PANIC';
}

function activityView(act){
  if (act.type==='quiz' || act.type==='blindtest'){
    return quizBorne(act);
  }
  if (act.type==='reaction_race'){
    const board = (act.buzzes||[]).slice().sort((a,b)=>a.t-b.t);
    const t0 = board.length ? board[0].t : 0;
    return `<div class="center">
      <h1 class="huge neon-cyan">⚡ REACTION RACE</h1>
      <p class="big">BUZZEZ sur vos téléphones !</p>
      <div class="card leaderboard" style="max-width:600px;margin:auto;text-align:left">
        ${board.length? board.map((b,i)=>`<div>${['🥇','🥈','🥉'][i]||(i+1+'.')} ${esc(b.name)} <span class="muted">+${b.t-t0}ms</span></div>`).join('')
                       : '<div class="muted center">En attente des buzz…</div>'}
      </div>
    </div>`;
  }
  if (act.type==='spotlight'){
    const name = esc(act.data?.targetName||'?');
    const defi = esc(act.data?.defi||'Relève le défi !');
    if (act.sub==='vote'){
      const votes = act.votes||{};
      const ok = Object.values(votes).filter(v=>v==='ok').length;
      const ko = Object.values(votes).filter(v=>v==='ko').length;
      return `<div class="center glow-box">
        <h1 class="huge neon-yellow">🔦 VERDICT ?</h1>
        <div class="big neon-pink">${name}</div>
        <p class="big">${defi}</p>
        <p class="big neon-cyan blink">Votez sur vos téléphones !</p>
        <div class="big" style="margin-top:14px">👏 <b class="neon-cyan">${ok}</b> &nbsp;·&nbsp; 💀 <b class="neon-pink">${ko}</b></div>
      </div>`;
    }
    if (act.sub==='result'){
      const win = act.verdict==='ok';
      return `<div class="center glow-box">
        <h1 class="huge ${win?'neon-cyan':'neon-pink'}">${win?'👏 RÉUSSI !':'💀 RATÉ !'}</h1>
        <div class="big">${name}</div>
        <p class="big">${defi}</p>
        <div class="big" style="margin-top:10px">👏 ${act.okCount||0} &nbsp;·&nbsp; 💀 ${act.koCount||0}</div>
        ${win?'':'<p class="big neon-pink blink">−1 vie 💔</p>'}
      </div>`;
    }
    return `<div class="center glow-box">
      <h1 class="huge neon-yellow">🔦 SPOTLIGHT</h1>
      <div class="big neon-pink">${name}</div>
      <p class="big">${defi}</p>
      <p class="big neon-yellow blink">À toi de jouer ! 🎤</p>
    </div>`;
  }
  if (act.type==='roue_des_gages'){
    return `<div class="center glow-box">
      <h1 class="huge neon-pink">🎰 LA ROUE DES GAGES</h1>
      <div class="wheel">🎡</div>
      <p class="big">${STATE.currentGage? esc(STATE.currentGage.titre): 'Ça tourne…'}</p>
    </div>`;
  }
  if (act.type==='boss_final'){
    return `<div class="center">
      <h1 class="huge neon-pink glow-box">👾 BOSS FINAL</h1>
      <div class="hpbar" style="max-width:700px;margin:18px auto"><div style="width:${act.data?.hp??100}%"></div></div>
      <p class="big">Enchaînez les QTE ! Vincent porte le coup final.</p>
    </div>`;
  }
  return `<div class="center"><h1 class="big">ACTIVITÉ</h1></div>`;
}

function quizBorne(act){
  const letters=['A','B','C','D','E'];
  const reveal = act.sub==='reveal';
  const title = act.type==='blindtest'?'🎵 BLIND-TEST':'❓ QUIZ ARCADE';

  // Fin de manche blind-test : classement + perdant
  if (act.sub==='final'){
    const board = act.finalBoard||[];
    const losers = act.loserNames||[];
    const min = board.length ? Math.min(...board.map(b=>b.pts)) : 0;
    const max = board.length ? Math.max(...board.map(b=>b.pts)) : 0;
    return `<div class="center">
      <h1 class="huge neon-yellow pixel">🏁 BLIND-TEST TERMINÉ</h1>
      <div class="card leaderboard" style="max-width:620px;margin:14px auto;text-align:left">
        ${board.map((p,i)=>{
          const last = max!==min && p.pts===min;
          return `<div${last?' style="color:var(--danger)"':''}>${['🥇','🥈','🥉'][i]||(i+1+'.')} ${esc(p.name)} <span class="coins">${p.pts} pts</span> ${last?'💔':''}</div>`;
        }).join('')||'<div class="muted center">Pas de score.</div>'}
      </div>
      ${losers.length
        ? `<p class="big neon-pink blink">💔 ${losers.map(esc).join(', ')} perd une vie !</p>`
        : `<p class="big muted">Égalité — personne ne perd de vie.</p>`}
    </div>`;
  }

  // Blind-test dynamique : avant la 1ère chanson (le GM doit appuyer sur ❓)
  if (act.dynamicBlindtest && !(act.choices && act.choices.length)) {
    return `<div class="center">
      <div class="pill neon-cyan">${title}</div>
      <p class="huge">🎵</p>
      <p class="big neon-yellow blink">Préparez vos oreilles…</p>
      <p class="muted">Le maître du jeu lance la première chanson.</p>
    </div>`;
  }

  const choices = (act.choices||[]).map((c,i)=>{
    let bg = '#1a0b2e', bd='#ffffff33';
    if (reveal && i===act.answer){ bg='#063d1e'; bd='var(--ok)'; }
    return `<div class="qchoice" style="background:${bg};border-color:${bd}">
      <b class="neon-yellow">${letters[i]}</b> ${esc(c)} ${reveal&&i===act.answer?'✔':''}</div>`;
  }).join('');
  const audio = (reveal && act.audioUrl) ? `<audio autoplay src="${esc(act.audioUrl)}"></audio>` : '';
  const progress = `${act.answeredCount}/${act.playerCount} ont répondu`;

  let footer = '';
  if (reveal && act.leaderboard){
    const champ = act.firstCorrectName
      ? `<p class="big neon-yellow" style="margin:6px 0">🥇 ${esc(act.firstCorrectName)} a trouvé en premier — BRAVO !</p>`
      : `<p class="big muted" style="margin:6px 0">Personne n'a trouvé… 😬</p>`;
    footer = `${champ}<div class="card leaderboard" style="max-width:600px;margin:14px auto 0;text-align:left">
      <div class="pixel neon-yellow center" style="font-size:13px">RÉSULTATS</div>
      ${act.leaderboard.map(p=>`<div>${p.correct?'✅':'❌'} ${esc(p.name)}${p.pts?` <span class="coins">+${p.pts} pts</span>`:''}</div>`).join('')||'<div class="muted center">Aucun joueur connecté.</div>'}
    </div>`;
  } else {
    footer = `<p class="big muted center mt">${progress}</p>`;
  }

  const qnum = `Q${act.qIndex+1}${act.total!=null?'/'+act.total:''}`;
  return `<div class="center">
    <div class="pill neon-cyan">${title} — ${qnum}</div>
    <h1 class="big neon-pink" style="margin:14px 0">${esc(act.prompt)}</h1>
    ${act.type==='blindtest' && !reveal ? '<p class="big neon-yellow blink">🔊 ÉCOUTEZ…</p>':''}
    <div style="max-width:760px;margin:auto;text-align:left">${choices}</div>
    ${footer}${audio}
  </div>`;
}

function gageBanner(g){
  return `<div class="card center glow-box" style="border-color:var(--neon3)">
    <div class="pill neon-yellow">🎲 GAGE</div>
    <div class="big neon-yellow">${esc(g.titre)}</div>
    <p>${esc(g.desc)}</p>
    ${g.targetName?`<p class="big">→ ${esc(g.targetName)}</p>`:''}
  </div>`;
}

function scoresStrip(){
  return `<div class="grid-players">${STATE.players.map(p=>`
    <div class="pcard ${p.connected?'':'off'}">
      <div>${avatarEmoji(p.avatar)} ${esc(p.name)}</div>
      <div>${'❤️'.repeat(p.lives)} <span class="coins">🪙${p.coins}</span></div>
    </div>`).join('')}</div>`;
}

function highScore(){
  const ranked = STATE.players.slice().sort((a,b)=>b.coins-a.coins);
  return `<div class="card leaderboard" style="max-width:600px;margin:auto;text-align:left">
    <div class="pixel neon-yellow center" style="font-size:14px">HIGH SCORE</div>
    ${ranked.map((p,i)=>`<div>${['🥇','🥈','🥉'][i]||(i+1+'.')} ${esc(p.name)} <span class="coins">🪙 ${p.coins}</span></div>`).join('')}
  </div>`;
}

// =================== BRIEFING (affichage borne) ===================
function setupBriefing(){
  if (briefKey === STATE.activity.startedAt) return; // déjà en place, l'interval gère
  briefKey = STATE.activity.startedAt;
  briefSlides = null; briefIdx = 0;
  stage.innerHTML = '<div class="center"><div class="big pixel blink">CHARGEMENT…</div></div>';
  tickerEl.textContent = 'BRIEFING — ouvrez grand les yeux !';
  fetch('/api/briefing').then(r=>r.json()).then(d=>{
    const scn = d.scenario.map(s=>({kind:'scn', title:s.title, text:s.text}));
    const ply = d.players.map(p=>({kind:'ply', ...p}));
    briefSlides = [...scn, {kind:'sep'}, ...ply, {kind:'go'}];
    briefIdx = 0; showBriefSlide();
    if (briefTimer) clearInterval(briefTimer);
    briefTimer = setInterval(()=>{ briefIdx=(briefIdx+1)%briefSlides.length; showBriefSlide(); }, 6500);
  }).catch(()=>{ stage.innerHTML='<div class="center"><p class="big">Erreur de chargement du briefing.</p></div>'; });
}
function showBriefSlide(){
  if(!briefSlides) return;
  const s = briefSlides[briefIdx]; if(!s) return;
  let html = '';
  if (s.kind==='scn')
    html = `<div class="center glow-box"><h1 class="huge neon-pink">${esc(s.title)}</h1><p class="big" style="max-width:900px;margin:24px auto">${esc(s.text)}</p></div>`;
  else if (s.kind==='sep')
    html = `<div class="center glow-box"><h1 class="huge neon-yellow">LES AVATARS</h1><p class="big">Voici qui vous êtes…</p></div>`;
  else if (s.kind==='ply')
    html = `<div class="center"><div class="huge">${s.emoji||'🎮'}</div><h1 class="big" style="color:${s.color||'#fff'}">${esc(s.avatarName||'')}</h1><p class="big">${esc(s.name)}${s.isHero?' 👑':''}</p><p class="big" style="max-width:840px;margin:16px auto">${esc(s.brief||'')}</p></div>`;
  else if (s.kind==='go')
    html = `<div class="center glow-box"><h1 class="huge neon-pink blink">PRÊTS&nbsp;?</h1><p class="big">INSERT COIN…</p></div>`;
  html += `<div class="center" style="margin-top:22px">${briefSlides.map((_,i)=>`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 4px;background:${i===briefIdx?'var(--neon)':'#ffffff33'}"></span>`).join('')}</div>`;
  stage.innerHTML = html;
}

// =================== SÉQUENCE MUSICALE (affichage borne) ===================
function renderMusicBorne(a){
  const slots = a.slots.map(s=>{
    if(s.st==='done') return `<div class="mslot" style="background:${s.color};color:#111">${esc(s.label)}</div>`;
    if(s.st==='hint') return `<div class="mslot" style="border-color:${s.color};color:${s.color}">${esc(s.label)}</div>`;
    return `<div class="mslot mhidden">?</div>`;
  }).join('');
  const win = a.status==='win';
  stage.innerHTML = `<div class="center">
    <h1 class="big neon-pink">🎵 SÉQUENCE MUSICALE</h1>
    <p class="big">${win?'<span class="neon-yellow pixel">MÉLODIE COMPLÈTE !</span>'
      :'Reproduisez la mélodie — chacun sa note, dans le bon ordre.'}</p>
    <div class="mrow" style="gap:12px">${slots}</div>
    <p class="muted mt">${a.step}/${a.len} ${a.wrongAt&&!win?'· <span class="neon-pink blink">raté, on reprend !</span>':''}</p>
  </div>`;
  tickerEl.textContent = 'SÉQUENCE MUSICALE — coordonnez-vous !';
}

// =================== ENQUÊTE (affichage borne) ===================
function renderEnqueteBorne(a){
  // Affiche le "mur d'enquête" : pitch, acte courant (article + énigme + indices),
  // et les révélations des actes déjà résolus.
  if (a.done && a.finale){
    const f = a.finale;
    stage.innerHTML = `<div class="center glow-box">
      <h1 class="huge neon-yellow pixel">🔓 ${esc(f.title)}</h1>
      <p class="big neon-pink">Le meurtrier : <b class="neon-yellow">${esc(f.culprit)}</b></p>
      <p class="big">${esc(f.role)}</p>
      <div class="card" style="max-width:900px;margin:18px auto;text-align:left;border-color:var(--neon3)">
        <div class="pill neon-cyan">MOBILE</div>
        <p>${esc(f.mobile)}</p>
      </div>

// Plan stylisé de Saint-Maur : la Marne + les sites publics remarquables.
// On NE trace PAS le parcours (c'est aux joueurs de relier les points dans
// l'ordre de leurs indices pour faire apparaître la lettre).
function enqueteMapSvg(map){
  const L = map.landmarks || [];
  const river = map.river ? `
    <path d="M2,40 C18,8 50,6 70,16 C92,28 100,55 88,78 C74,98 34,98 20,82 C8,68 2,55 2,40 Z"
      fill="none" stroke="#1b6fb8" stroke-width="2.4" opacity="0.55"/>
    <path d="M2,40 C18,8 50,6 70,16 C92,28 100,55 88,78 C74,98 34,98 20,82 C8,68 2,55 2,40 Z"
      fill="#0a2a44" opacity="0.18"/>` : '';
  const dots = L.map((m)=>`
    <circle cx="${m.x}" cy="${m.y}" r="2.4" fill="#ffe600" stroke="#ff2e88" stroke-width="0.9"/>
    <circle cx="${m.x}" cy="${m.y}" r="4.2" fill="none" stroke="#ffe600" stroke-width="0.4" opacity="0.5"/>
  `).join('');
  // étiquettes : côté explicite par site (lbl) pour éviter les chevauchements
  const labels = L.map((m)=>{
    const side = m.lbl || (m.x > 55 ? 'l' : 'r');
    let tx = m.x, ty = m.y + 1.1, anchor = 'middle';
    if (side === 'r') { tx = m.x + 5; anchor = 'start'; }
    else if (side === 'l') { tx = m.x - 5; anchor = 'end'; }
    else if (side === 't') { ty = m.y - 5; anchor = 'middle'; }
    else if (side === 'b') { ty = m.y + 6.5; anchor = 'middle'; }
    return `<text x="${tx}" y="${ty}" font-size="2.7" fill="#dffaff"
      text-anchor="${anchor}" style="font-family:var(--term)">${esc(m.short||m.name)}</text>`;
  }).join('');
  return `<div class="card" style="text-align:center;border-color:var(--neon4);margin-top:14px;background:#03020c">
    <div class="pill neon-cyan">🗺️ PLAN DE SAINT-MAUR — sites publics remarquables</div>
    <p class="muted" style="font-size:17px">${esc(map.instruction||'')}</p>
    <svg viewBox="0 0 100 100" style="width:100%;max-width:760px;height:auto;background:#03020c;border:2px solid #ffffff22;border-radius:10px">
      ${river}${dots}${labels}
    </svg>
    <p class="neon-yellow" style="font-size:18px">Reliez les 7 sites dans l'ordre de vos indices : le tracé dessine une lettre.</p>
  </div>`;
}

// Bandeau de déchiffrement César : alphabet numéroté + cryptogramme.
function enqueteCipherStrip(c){
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const alpha = A.map((ch,i)=>`<span style="display:inline-block;width:30px;text-align:center;border:1px solid #ffffff22;padding:3px 0">
    <div class="neon-cyan" style="font-size:18px">${ch}</div><div class="muted" style="font-size:11px">${i+1}</div></span>`).join('');
  const crypto = (c.ciphertext||'').split('').map(ch=>`<span style="display:inline-block;width:42px;height:52px;line-height:52px;text-align:center;margin:3px;border:3px solid var(--neon);border-radius:8px;background:#1a0b2e" class="neon-yellow">${esc(ch)}</span>`).join('');
  return `<div class="card glow-box" style="text-align:center;border-color:var(--neon);margin-top:14px">
    <div class="pill neon-pink">🔐 MESSAGE CODÉ — clé : « ${esc(c.keyLetter||'?')} »</div>
    <div style="margin:10px 0">${crypto}</div>
    <p class="muted" style="font-size:17px">${esc(c.help||'')}</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:8px">${alpha}</div>
  </div>`;
}

// Détection sonore de la séquence musicale (démo, note jouée, erreur, victoire)
let _m = { demoAt: 0, step: 0, wrongAt: 0, win: false };
function detectMusic(s){
  if(!SOUND_ON || !window.SFX) return;
  const a = s.activity;
  if(!a || a.type!=='music_seq'){ _m = { demoAt:0, step:0, wrongAt:0, win:false }; return; }
  if(a.demo && a.demo.at && a.demo.at!==_m.demoAt){
    _m.demoAt = a.demo.at; let t = 0;
    a.demo.seq.forEach(n=>{ SFX.note(n.freq, t, 0.34); t += 0.42; });
  }
  if(a.step>_m.step && a.slots[a.step-1] && a.slots[a.step-1].freq){ SFX.note(a.slots[a.step-1].freq); }
  if(a.wrongAt && a.wrongAt!==_m.wrongAt){ SFX.wrong(); }
  if(a.status==='win' && !_m.win){ SFX.win(); _m.win = true; }
  _m.step = a.step; _m.wrongAt = a.wrongAt || 0;
}

// =================== DÉFI DES PIXELS (enfants, sur la borne) ===================
function buildKidsPad(){
  const seqLen = (STATE.activity.data && STATE.activity.data.len) || 3;
  let sequence = Array.from({length:seqLen}, ()=>Math.floor(Math.random()*4));
  let input = [];
  let accepting = false;

  stage.innerHTML = `
    <div class="center">
      <h1 class="big neon-yellow">👾 LE DÉFI DES PIXELS</h1>
      <p class="big" id="kidsmsg">Robin & Juliette : regardez bien les couleurs…</p>
      <div class="padgrid">
        ${[0,1,2,3].map(i=>`<div class="pad pad${i}" id="pad${i}"></div>`).join('')}
      </div>
      <button class="btn warn" style="max-width:320px;margin:0 auto" id="kidsreplay">🔁 REVOIR</button>
    </div>`;

  const msg = document.getElementById('kidsmsg');
  const pads = [0,1,2,3].map(i=>document.getElementById('pad'+i));

  function flash(i, dur=450){
    return new Promise(r=>{
      pads[i].classList.add('lit');
      if(window.SFX) SFX.pad(i);
      setTimeout(()=>{ pads[i].classList.remove('lit'); setTimeout(r, 150); }, dur);
    });
  }
  async function playSequence(){
    accepting = false; input = [];
    msg.textContent = 'Regardez bien…';
    await new Promise(r=>setTimeout(r, 600));
    for(const i of sequence){ await flash(i); }
    msg.textContent = 'À VOUS ! Tapez les couleurs dans l\'ordre 👆';
    accepting = true;
  }
  function win(){
    accepting = false;
    if(window.SFX) SFX.padOk();
    stage.innerHTML = `<div class="center glow-box">
      <h1 class="huge neon-yellow">👾 BRAVO LES PIXELS !</h1>
      <p class="big">Robin & Juliette ont réveillé l'Élu.</p>
      <p class="big neon-pink blink">👑 Remettez la CARTE DORÉE à Vincent !</p>
    </div>`;
    fetch('/api/kids/done',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  }
  function tap(i){
    if(!accepting) return;
    if(window.SFX) SFX.pad(i);
    pads[i].classList.add('lit'); setTimeout(()=>pads[i].classList.remove('lit'),180);
    input.push(i);
    const idx = input.length-1;
    if(input[idx]!==sequence[idx]){
      accepting = false;
      msg.textContent = 'Presque ! On recommence… 😊';
      setTimeout(playSequence, 900);
      return;
    }
    if(input.length===sequence.length) win();
  }

  pads.forEach((p,i)=>p.addEventListener('click', ()=>tap(i)));
  document.getElementById('kidsreplay').addEventListener('click', playSequence);
  playSequence();
}

    : '<p class="big muted">Aucune photo soumise pour l\'instant…</p>';

// Récupère TOUTE la playlist rock d'un coup : getPlaylist() renvoie la liste
// complète des IDs chargés ; le serveur en tire les titres via oEmbed. Aucun
// défilement, aucune gêne pour la lecture. On retente car la liste met parfois
// 1-2 s à se peupler, et on rafraîchit (les mix radio s'allongent en jouant).
let _harvestTimer = null;
function harvestTracks(player){
  if (_harvestTimer) return;
  const grab = () => {
    let ids = [];
    try { ids = player.getPlaylist() || []; } catch(_){}
    if (ids && ids.length) {
      fetch('/api/blindtest/playlist', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ids })
      }).catch(()=>{});
    }
  };
  setTimeout(grab, 800);
  let n = 0;
  _harvestTimer = setInterval(() => { grab(); if (++n >= 12) { clearInterval(_harvestTimer); } }, 2500);
}

// =================== BLIND-TEST DYNAMIQUE ===================
// Le serveur a pioché une vidéo au hasard (a.playVideoId) : la borne la charge
// et la joue. playRequestedAt change à chaque nouvelle chanson (même id rejouable).
let _lastPlayReq = 0;
function syncBlindtest(s) {
  const a = s.activity;
  if (!a || a.type !== 'blindtest') { _lastPlayReq = 0; return; }
  if (a.playVideoId && a.playRequestedAt && a.playRequestedAt !== _lastPlayReq && a.sub === 'question') {
    _lastPlayReq = a.playRequestedAt;
    try {
      if (ytBt) { ytBt.loadVideoById(a.playVideoId); ytBt.unMute(); ytBt.playVideo(); }
      if (ytAmb) ytAmb.pauseVideo();
    } catch(_) {}
  }
}

// =================== YOUTUBE (ambiance gaming + blind-test rock) ===================
let ytAmb = null, ytBt = null, ytApiReady = false, ytInited = false;

window.onYouTubeIframeAPIReady = function(){ ytApiReady = true; initYT(); }; // démarre muet sans attendre de clic

function initYT(){
  if (ytInited || !ytApiReady) return;
  ytInited = true;
  fetch('/api/ytconfig').then(r=>r.json()).then(cfg=>{
    if (cfg.ambiance) {
      ytAmb = new YT.Player('yt-amb', {
        height:'1', width:'1',
        playerVars:{ listType:'playlist', list:cfg.ambiance, autoplay:1, loop:1, controls:0, disablekb:1, fs:0, modestbranding:1, mute:1 },
        events:{
          onReady(e){ e.target.setShuffle(true); e.target.playVideo(); }, // muet jusqu'au 1er clic
          onStateChange(e){ if(e.data===YT.PlayerState.ENDED) e.target.nextVideo(); }
        }
      });
    }
    if (cfg.blindtest) {
      ytBt = new YT.Player('yt-bt', {
        height:'1', width:'1',
        playerVars:{ listType:'playlist', list:cfg.blindtest, autoplay:1, loop:1, controls:0, disablekb:1, fs:0, modestbranding:1, mute:1 },
        events:{
          onReady(e){ e.target.setShuffle(true); e.target.mute(); e.target.playVideo(); harvestTracks(e.target); }, // muet : on moissonne les titres
          onStateChange(e){
            // Collecter le titre pour le blind-test dynamique
            if (e.data === YT.PlayerState.PLAYING) {
              try {
                const d = e.target.getVideoData();
                if (d && d.video_id && d.title) {
                  fetch('/api/blindtest/addtrack', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ videoId: d.video_id, videoTitle: d.title }),
                  }).catch(()=>{});
                }
              } catch(_) {}
            }
            if (e.data === YT.PlayerState.ENDED) e.target.nextVideo();
          }
        }
      });
    }
  }).catch(()=>{});
}

function syncYT(s){
  const a = s.activity;
  const isBT = a && a.type === 'blindtest';
  // Une chanson est posée uniquement quand le QCM est affiché (sub === 'question'
  // ET un playVideoId existe). Sinon (avant 1ère chanson, ou révélation) : silence
  // côté rock, l'ambiance gaming reprend en fond.
  const songOn = isBT && a.sub === 'question' && !!a.playVideoId;
  try {
    if (songOn) {
      if (ytBt) { ytBt.unMute(); ytBt.playVideo(); }
      if (ytAmb) ytAmb.pauseVideo();
    } else {
      if (ytBt) ytBt.mute();
      if (ytAmb) ytAmb.playVideo();
    }
  } catch(_){}
}
