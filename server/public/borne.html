<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIXEL PANIC — BORNE</title>
<link rel="stylesheet" href="/static/arcade.css" />
<script src="/static/sound.js"></script>
<script src="/static/fullscreen.js"></script>
<script src="/static/pacman-render.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  #soundhint { position: fixed; top: 8px; left: 8px; z-index: 100000; cursor: pointer;
    background: rgba(3,1,10,.7); color: var(--neon3); border: 2px solid var(--neon3);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  /* iPad 4:3 — la borne tient TOUJOURS dans l'écran, sans scroll */
  html, body { height: 100%; }
  body { font-size: 26px; overflow: hidden; }
  .stage { max-width: 1100px; margin: 0 auto; padding: 14px 18px; box-sizing: border-box;
           height: calc(100vh - 46px); display: flex; flex-direction: column;
           justify-content: center; overflow: hidden; }
  .stage > * { max-height: 100%; }
  .big { font-size: clamp(26px, 4.2vh, 50px); }
  .huge { font-size: clamp(40px, 9vh, 88px); }
  /* tailles fluides en hauteur pour les blocs denses (quiz, classements) */
  .leaderboard { max-height: 46vh; overflow: auto; }
  .ticker { position: fixed; bottom: 0; left: 0; right: 0; background:#000; border-top:3px solid var(--neon);
            white-space: nowrap; overflow: hidden; }
  .ticker span { display: inline-block; padding: 10px 0; font-family: var(--pixel); font-size: 16px;
            color: var(--neon3); animation: scroll 45s linear infinite; }
  @keyframes scroll { from { transform: translateX(100%);} to { transform: translateX(-100%);} }
  @keyframes spin { from { transform: rotate(0);} to { transform: rotate(360deg);} }
  .leaderboard div { font-size: clamp(16px, 2.6vh, 28px); padding: clamp(3px,0.7vh,8px); border-bottom: 1px solid #fff2; }
  .hpbar { height: 34px; background:#300; border:3px solid #000; border-radius:6px; overflow:hidden; }
  .hpbar > div { height:100%; background:linear-gradient(90deg,var(--danger),var(--neon3)); transition:width .3s; }
  .wheel { font-size: 70px; }
  .qchoice { font-size: clamp(18px, 2.9vh, 30px); padding: clamp(6px,1.1vh,14px) 18px; margin: clamp(5px,1vh,10px) 0;
             border:3px solid #fff3; border-radius:10px; box-shadow:0 4px 0 #0008; }
  .padgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; max-width:560px;
             margin:18px auto; }
  .pad { aspect-ratio:1; border-radius:20px; border:6px solid #000; cursor:pointer;
         box-shadow:0 8px 0 #0009; transition:filter .1s, transform .05s; filter:brightness(.45); }
  .pad.lit { filter:brightness(1.6); }
  .pad:active { transform:translateY(4px); }
  .pad0{background:#ff2e88} .pad1{background:#2effd5} .pad2{background:#7a5cff} .pad3{background:#ffe600}
  /* Clavier AZERTY du boss final */
  .kbd { display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:10px; }
  .krow { display:flex; gap:6px; }
  .kkey { min-width:clamp(26px,3.4vw,42px); height:clamp(34px,5.4vh,50px); padding:0 6px; display:flex;
    align-items:center; justify-content:center; background:#171430; color:#cfd2e0; border:2px solid #3a2bd0;
    border-radius:7px; font-size:clamp(13px,1.8vh,18px); font-family:Arial; user-select:none; touch-action:none; cursor:pointer; }
  .kkey.wide { min-width:clamp(54px,7vw,88px); } .kkey.xwide { min-width:clamp(150px,26vw,300px); }
  .kkey.kdown { background:#ffe600; color:#160a2e; border-color:#ffe600; transform:translateY(2px); }
</style>
</head>
<body class="scanlines">
<div id="yt-amb" style="position:fixed;width:1px;height:1px;top:-9px;left:-9px"></div>
<div id="yt-bt"  style="position:fixed;width:1px;height:1px;top:-9px;left:-9px"></div>
<div id="yt-pac" style="position:fixed;width:1px;height:1px;top:-9px;left:-9px"></div>
<div id="soundhint" class="pixel">🔊 Activer le son</div>
<div class="stage" id="stage"><div class="center huge pixel blink">INSERT COIN</div></div>
<div class="ticker"><span id="ticker">PIXEL PANIC — la réalité a buggé…</span></div>

<script>
const stage = document.getElementById('stage');
const tickerEl = document.getElementById('ticker');
let STATE = null;

let lastSse = 0;
let _lastBorneJson = null;
function applyState(s){
  STATE = s; detectSounds(STATE); detectMusic(STATE); syncYT(STATE); syncBlindtest(STATE);
  // On ne reconstruit le DOM que si l'état a changé (évite le clignotement à chaque poll).
  const j = JSON.stringify(s);
  if (j !== _lastBorneJson) { _lastBorneJson = j; render(); }
}
const es = new EventSource('/events');
es.onmessage = (e) => { lastSse = Date.now(); applyState(JSON.parse(e.data)); };
function pollBorne(){ fetch('/api/state').then(r=>r.json()).then(applyState).catch(()=>{}); }
pollBorne();
setInterval(() => { if (Date.now() - lastSse > 1500) pollBorne(); }, 1000);
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// --- Activation du son au 1er clic n'importe où (obligatoire sur navigateur) ---
let SOUND_ON = false;
function enableSound(){
  if (SOUND_ON) return;
  if (window.SFX) { SFX.unlock(); SFX.coin(); if (SFX.pacPreload) SFX.pacPreload(); }
  SOUND_ON = true;
  const h = document.getElementById('soundhint'); if (h) h.style.display = 'none';
  if (ytAmb) { try { ytAmb.unMute(); } catch(_){} } // déjà en train de jouer, on retire juste le mute
  else initYT(); // API pas encore prête, on démarre normalement
}
document.getElementById('soundhint').addEventListener('click', enableSound);
['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, enableSound, { once: false }));

// --- Déclenche les bruitages sur les transitions d'état ---
let _p = { phase: null, world: null, gageId: null, act: null, sub: null };
function detectSounds(s){
  if (!SOUND_ON || !window.SFX) return;
  const w = s.world ? s.world.num : null;
  const act = s.activity ? s.activity.type : null;
  const sub = s.activity ? s.activity.sub : null;
  const gageId = s.currentGage ? (s.currentGage.id + '-' + (s.currentGage.at || '')) : null;
  if (_p.phase === null) { _p = { phase: s.phase, world: w, gageId, act, sub }; return; }
  try {
    if (s.phase === 'win' && _p.phase !== 'win') SFX.win();
    else if (s.phase === 'world' && _p.phase === 'lobby') SFX.start();
    else if (w && w !== _p.world) { (s.world && s.world.isTwist) ? SFX.twist() : SFX.level(); }
    if (act && act !== _p.act) SFX.start();
    if ((act === 'quiz' || act === 'blindtest') && sub === 'reveal' && _p.sub !== 'reveal') SFX.correct();
    if (gageId && gageId !== _p.gageId) SFX.gage();
  } catch (_) {}
  _p = { phase: s.phase, world: w, gageId, act, sub };
}

let kidsKey = null;
let pacKey = null;
let tronKey = null;
let pongKey = null;
let drawKey = null;
let bossKey = null;
let pacEventSeen = 0;
let briefKey = null, briefTimer = null, briefSlides = null, briefIdx = 0;
function render(){
  if(!STATE) return;
  // Nettoyage du briefing dès qu'on ne l'affiche PLUS (passage au monde, stop…)
  const _inBrief = STATE.phase==='activity' && STATE.activity
    && STATE.activity.type==='briefing' && STATE.activity.state!=='done';
  if (briefTimer && !_inBrief){
    clearInterval(briefTimer); briefTimer = null; briefKey = null;
    if (window.SFX && SFX.briefMusicStop) SFX.briefMusicStop();
  }
  // --- BRIEFING : déroulé scénario + attendus par joueur ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='briefing'){
    setupBriefing(); return;
  }
  // --- PAC-MAN : prend le contrôle de la borne ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='pacman' && STATE.pacman){
    renderPacmanBorne(); return;
  }
  pacKey = null;
  // --- TETRIS : les 2 meilleurs encore en vie ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='tetris' && STATE.tetris){
    renderTetrisBorne(); return;
  }
  // --- TRON : arène centrale ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='tron' && STATE.tron){
    renderTronBorne(); return;
  }
  tronKey = null;
  // --- 2048 : les 2 meilleurs ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='2048' && STATE.g2048){
    render2048Borne(); return;
  }
  // --- PONG : arène centrale ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='pong' && STATE.pong){
    renderPongBorne(); return;
  }
  pongKey = null;
  // --- DESSINE-MOI : le dessin en direct ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='draw'){
    renderDrawBorne(); return;
  }
  drawKey = null;
  // --- BOSS FINAL : clavier AZERTY (construit une seule fois pour garder le multi-touch) ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='boss_final'){
    renderBossBorne(); return;
  }
  bossKey = null;
  // --- Séquence musicale ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='music_seq'){
    renderMusicBorne(STATE.activity); return;
  }
  // --- Enquête collaborative (Cold Case Saint-Maur) ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='enquete'){
    renderEnqueteBorne(STATE.activity); return;
  }
  // --- Roue des gages (spin → défi → vote → résultat) ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='roue_des_gages'){
    renderRoueBorne(STATE.activity); return;
  }
  if (roueCountTimer){ clearInterval(roueCountTimer); roueCountTimer = null; }
  // --- Diffusion vidéo (danse des canards, anecdotes…) ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='videoshow'){
    renderVideoBorne(STATE.activity); return;
  }
  if (videoKey){ videoKey = null; destroyShowPlayer(); } // on a quitté : coupe le son
  // --- Mosaïque de téléphones ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='mosaic'){
    const a = STATE.activity;
    const q = (a.rows||1) > 1;
    if (a.solved){
      stage.innerHTML = `<div class="center glow-box">
        <h1 class="huge neon-cyan pixel">✅ RÉSOLU !</h1>
        <p class="big">Mot reconstitué :</p>
        <div class="huge pixel neon-yellow" style="letter-spacing:8px">${esc(a.answer||'')}</div>
        ${a.solvedBy?`<p class="big neon-cyan">Trouvé par ${esc(a.solvedBy)} 🎉</p>`:''}
      </div>`;
      tickerEl.textContent = 'MOSAÏQUE — résolue !';
      return;
    }
    if (a.failed){
      stage.innerHTML = `<div class="center glow-box">
        <h1 class="huge neon-pink pixel">⏱ TROP D'ERREURS</h1>
        <p class="big">La réponse était :</p>
        <div class="huge pixel neon-yellow" style="letter-spacing:8px">${esc(a.answer||'')}</div>
      </div>`;
      tickerEl.textContent = 'MOSAÏQUE — réponse révélée.';
      return;
    }
    stage.innerHTML = `<div class="center">
      <h1 class="big neon-cyan">🧩 MOSAÏQUE${a.round>1?` · MANCHE ${a.round}`:''}</h1>
      ${q ? `
        <p class="big">Chaque écran affiche <b>${a.rows} lignes</b>… mais <b>UNE SEULE est la bonne</b> (celle qui s'allume en COULEUR).</p>
        <div class="huge">📱↗️📱↘️📱</div>
        <p class="big neon-yellow">Disposez vos <b>${a.n}</b> téléphones EN QUINCONCE (en escalier) pour aligner les lignes colorées en un seul mot.</p>`
      : `
        <p class="big">Posez vos <b>${a.n}</b> téléphones côte à côte, dans le BON ORDRE, pour reconstituer le mot secret.</p>
        <div class="huge">📱📱📱</div>`}
      <p class="big neon-yellow blink">Tapez la réponse sur un téléphone 👇</p>
      <p class="muted">Erreurs : ${a.wrongCount||0}/${a.maxWrong||3} (réponse révélée au-delà).</p>
    </div>`;
    tickerEl.textContent = q ? 'MOSAÏQUE — placez vos téléphones EN QUINCONCE et devinez le mot !' : 'MOSAÏQUE — alignez vos téléphones et devinez le mot !';
    return;
  }
  // --- Défi des enfants : prend le contrôle de la borne (insensible au SSE) ---
  if (STATE.phase==='activity' && STATE.activity && STATE.activity.type==='pixel_pad'){
    if (kidsKey !== STATE.activity.startedAt){ kidsKey = STATE.activity.startedAt; buildKidsPad(); }
    tickerEl.textContent = "LES PIXELS À L'HONNEUR — Robin & Juliette !";
    return;
  }
  kidsKey = null;

  // --- Galerie photo (vote ou résultats) ---
  if (STATE.photoPhase) { renderPhotoBorne(); return; }

  const connected = STATE.players.filter(p=>p.connected).length;
  let html = '';

  if (STATE.phase === 'lobby') {
    html = `
      <div class="center">
        <div class="huge pixel neon-pink blink">INSERT COIN</div>
        <p class="big">Scanne ton QR pour rejoindre la partie</p>
        <div class="grid-players mt">
          ${STATE.players.map(p=>`<div class="pcard ${p.connected?'':'off'}">
            <div class="emoji">${avatarEmoji(p.avatar)}</div>
            <div>${esc(p.name)}</div>
            <div class="pill ${p.ready?'neon-cyan':''}">${p.connected?(p.ready?'PRÊT':'…'):'OFF'}</div>
          </div>`).join('')}
        </div>
        <p class="muted mt">${connected} joueur(s) connecté(s)</p>
      </div>`;
  }

  else if (STATE.phase === 'activity' && STATE.activity) {
    html = activityView(STATE.activity);
  }

  else if (STATE.phase === 'win') {
    if (STATE.winVideo) {
      html = `<div class="center" style="padding-top:10px">
        <h1 class="huge neon-yellow pixel blink">💥 BRAVO</h1>
        <h2 class="big neon-pink" style="margin-top:0">BON ANNIVERSAIRE VINCENT !</h2>
        <div style="margin-top:10px;max-width:560px;width:90%">
          <div style="position:relative;padding-bottom:56.25%;height:0">
            <iframe src="https://www.youtube.com/embed/${STATE.winVideo}?autoplay=1&playsinline=1" style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:12px" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          </div>
        </div>
        <div class="mt">${highScore()}</div>
      </div>`;
    } else {
      html = `<div class="center glow-box">
        <div class="huge pixel neon-yellow">YOU&nbsp;WIN!</div>
        <p class="big">La réalité a redémarré. 🎉</p>
        <div class="mt">${highScore()}</div>
      </div>`;
    }
  }

  else if (STATE.world) {
    const w = STATE.world;
    html = `<div>
      ${w.isTwist ? `<div class="center huge pixel neon-yellow glow-box">⚡ PLAYER ONE ⚡</div>`:''}
      <div class="pill neon-yellow">MONDE ${w.num}/${STATE.worldCount}</div>
      <h1 class="big neon-pink">${esc(w.titre)}</h1>
      <p>${esc(w.intro)}</p>
      ${STATE.currentGage ? gageBanner(STATE.currentGage) : ''}
      <div class="mt">${scoresStrip()}</div>
    </div>`;
  }

  stage.innerHTML = html;
  tickerEl.textContent = (STATE.log||[]).map(l=>l.msg).join('   ◆   ') || 'PIXEL PANIC';
}

function activityView(act){
  if (act.type==='quiz' || act.type==='blindtest'){
    return quizBorne(act);
  }
  if (act.type==='reaction_race'){
    const board = (act.buzzes||[]).slice().sort((a,b)=>a.t-b.t);
    const t0 = board.length ? board[0].t : 0;
    const done = act.resolved;
    return `<div class="center">
      <h1 class="huge neon-cyan">⚡ REACTION RACE</h1>
      <p class="big">${done ? 'TERMINÉ !' : 'BUZZEZ sur vos téléphones !'}</p>
      ${done ? `<div class="card glow-box" style="max-width:640px;margin:0 auto 12px">
          <p class="big neon-yellow">⚡ ${esc(act.firstName||'?')} — LE PLUS RAPIDE (+1 vie ❤️)</p>
          <p class="big neon-pink">🐢 ${esc(act.lastName||'?')} — LE PLUS LENT (−1 vie 💔)</p>
        </div>` : ''}
      <div class="card leaderboard" style="max-width:600px;margin:auto;text-align:left">
        ${board.length? board.map((b,i)=>{
          const tag = i===0?'⚡':(i===board.length-1&&done?'🐢':(['','🥈','🥉'][i]||(i+1+'.')));
          return `<div>${tag} ${esc(b.name)} <span class="muted">+${b.t-t0}ms</span></div>`;
        }).join('')
                       : '<div class="muted center">En attente des buzz…</div>'}
      </div>
    </div>`;
  }
  if (act.type==='spotlight'){
    const name = esc(act.data?.targetName||'?');
    const defi = esc(act.data?.defi||'Relève le défi !');
    if (act.sub==='vote'){
      const votes = act.votes||{};
      const ok = Object.values(votes).filter(v=>v==='ok').length;
      const ko = Object.values(votes).filter(v=>v==='ko').length;
      return `<div class="center glow-box">
        <h1 class="huge neon-yellow">🔦 VERDICT ?</h1>
        <div class="big neon-pink">${name}</div>
        <p class="big">${defi}</p>
        <p class="big neon-cyan blink">Votez sur vos téléphones !</p>
        <div class="big" style="margin-top:14px">👏 <b class="neon-cyan">${ok}</b> &nbsp;·&nbsp; 💀 <b class="neon-pink">${ko}</b></div>
      </div>`;
    }
    if (act.sub==='result'){
      const win = act.verdict==='ok';
      return `<div class="center glow-box">
        <h1 class="huge ${win?'neon-cyan':'neon-pink'}">${win?'👏 RÉUSSI !':'💀 RATÉ !'}</h1>
        <div class="big">${name}</div>
        <p class="big">${defi}</p>
        <div class="big" style="margin-top:10px">👏 ${act.okCount||0} &nbsp;·&nbsp; 💀 ${act.koCount||0}</div>
        ${win?'':'<p class="big neon-pink blink">−1 vie 💔</p>'}
      </div>`;
    }
    return `<div class="center glow-box">
      <h1 class="huge neon-yellow">🔦 SPOTLIGHT</h1>
      <div class="big neon-pink">${name}</div>
      <p class="big">${defi}</p>
      <p class="big neon-yellow blink">À toi de jouer ! 🎤</p>
    </div>`;
  }
  // (le boss final est rendu par renderBossBorne via le dispatch — pas ici)
  return `<div class="center"><h1 class="big">ACTIVITÉ</h1></div>`;
}

function quizBorne(act){
  const letters=['A','B','C','D','E'];
  const reveal = act.sub==='reveal';
  const title = act.type==='blindtest'?'🎵 BLIND-TEST':'❓ QUIZ ARCADE';

  // Fin de manche blind-test : classement + vainqueur + perdant
  if (act.sub==='final'){
    const board = act.finalBoard||[];
    const losers = act.loserNames||[];
    const winners = act.winnerNames||[];
    const min = board.length ? Math.min(...board.map(b=>b.pts)) : 0;
    const max = board.length ? Math.max(...board.map(b=>b.pts)) : 0;
    return `<div class="center">
      <h1 class="huge neon-yellow pixel">🏁 BLIND-TEST TERMINÉ</h1>
      ${winners.length ? `<p class="big neon-cyan glow-box" style="display:inline-block;padding:6px 18px">🏆 VAINQUEUR : ${winners.map(esc).join(' & ')}</p>` : ''}
      <div class="card leaderboard" style="max-width:620px;margin:14px auto;text-align:left">
        ${board.map((p,i)=>{
          const last = max!==min && p.pts===min;
          return `<div${last?' style="color:var(--danger)"':''}>${['🥇','🥈','🥉'][i]||(i+1+'.')} ${esc(p.name)} <span class="coins">${p.pts} pts</span> ${last?'💔':''}</div>`;
        }).join('')||'<div class="muted center">Pas de score.</div>'}
      </div>
      ${losers.length
        ? `<p class="big neon-pink blink">💔 ${losers.map(esc).join(', ')} perd une vie !</p>`
        : `<p class="big muted">Égalité — personne ne perd de vie.</p>`}
    </div>`;
  }

  // Blind-test dynamique : avant la 1ère chanson (le GM doit appuyer sur ❓)
  if (act.dynamicBlindtest && !(act.choices && act.choices.length)) {
    return `<div class="center">
      <div class="pill neon-cyan">${title}</div>
      <p class="huge">🎵</p>
      <p class="big neon-yellow blink">Préparez vos oreilles…</p>
      <p class="muted">Le maître du jeu lance la première chanson.</p>
    </div>`;
  }

  const choices = (act.choices||[]).map((c,i)=>{
    let bg = '#1a0b2e', bd='#ffffff33';
    if (reveal && i===act.answer){ bg='#063d1e'; bd='var(--ok)'; }
    return `<div class="qchoice" style="background:${bg};border-color:${bd}">
      <b class="neon-yellow">${letters[i]}</b> ${esc(c)} ${reveal&&i===act.answer?'✔':''}</div>`;
  }).join('');
  const audio = (reveal && act.audioUrl) ? `<audio autoplay src="${esc(act.audioUrl)}"></audio>` : '';
  const progress = `${act.answeredCount}/${act.playerCount} ont répondu`;

  const qnum = `Q${act.qIndex+1}${act.total!=null?'/'+act.total:''}`;

  // RÉVÉLATION : mise en page 2 colonnes (choix | résultats) pour tenir sur iPad 4:3
  if (reveal && act.leaderboard){
    const champ = act.firstCorrectName
      ? `<p class="big neon-yellow" style="margin:4px 0">🥇 ${esc(act.firstCorrectName)} — le/la plus rapide !</p>`
      : `<p class="big muted" style="margin:4px 0">Personne n'a trouvé… 😬</p>`;
    const results = `<div class="card leaderboard" style="text-align:left;margin:0">
      <div class="pixel neon-yellow center" style="font-size:13px">RÉSULTATS</div>
      ${act.leaderboard.map(p=>`<div>${p.correct?'✅':'❌'} ${esc(p.name)}${p.pts?` <span class="coins">+${p.pts}</span>`:''}</div>`).join('')||'<div class="muted center">Aucun joueur.</div>'}
    </div>`;
    return `<div class="center">
      <div class="pill neon-cyan">${title} — ${qnum}</div>
      <h1 class="big neon-pink" style="margin:6px 0">${esc(act.prompt)}</h1>

function setupBriefing(){
  if (briefKey === STATE.activity.startedAt) return; // déjà en place, l'interval gère
  briefKey = STATE.activity.startedAt;
  briefSlides = null; briefIdx = 0;
  if (SOUND_ON && window.SFX && SFX.briefMusic) SFX.briefMusic(); // musique chiptune de fond
  stage.innerHTML = '<div class="center"><div class="big pixel blink">CHARGEMENT…</div></div>';
  tickerEl.textContent = 'BRIEFING — ouvrez grand les yeux !';
  fetch('/api/briefing').then(r=>r.json()).then(d=>{
    const scn = d.scenario.map(s=>({kind:'scn', title:s.title, text:s.text}));
    const ply = d.players.map(p=>({kind:'ply', ...p}));
    briefSlides = [...scn, {kind:'sep'}, ...ply, {kind:'go'}];
    briefIdx = 0; showBriefSlide();
    if (briefTimer) clearInterval(briefTimer);
    briefTimer = setInterval(()=>{ briefIdx=(briefIdx+1)%briefSlides.length; showBriefSlide(); }, 6500);
  }).catch(()=>{ stage.innerHTML='<div class="center"><p class="big">Erreur de chargement du briefing.</p></div>'; });
}
function showBriefSlide(){
  if(!briefSlides) return;
  const s = briefSlides[briefIdx]; if(!s) return;
  let html = '';
  if (s.kind==='scn')
    html = `<div class="center glow-box"><h1 class="huge neon-pink">${esc(s.title)}</h1><p class="big" style="max-width:900px;margin:24px auto">${esc(s.text)}</p></div>`;
  else if (s.kind==='sep')
    html = `<div class="center glow-box"><h1 class="huge neon-yellow">LES AVATARS</h1><p class="big">Voici qui vous êtes…</p></div>`;
  else if (s.kind==='ply')
    html = `<div class="center"><div class="huge">${s.emoji||'🎮'}</div><h1 class="big" style="color:${s.color||'#fff'}">${esc(s.avatarName||'')}</h1><p class="big">${esc(s.name)}${s.isHero?' 👑':''}</p><p class="big" style="max-width:840px;margin:16px auto">${esc(s.brief||'')}</p></div>`;
  else if (s.kind==='go')
    html = `<div class="center glow-box"><h1 class="huge neon-pink blink">PRÊTS&nbsp;?</h1><p class="big">INSERT COIN…</p></div>`;
  html += `<div class="center" style="margin-top:22px">${briefSlides.map((_,i)=>`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 4px;background:${i===briefIdx?'var(--neon)':'#ffffff33'}"></span>`).join('')}</div>`;
  stage.innerHTML = html;
}

let videoKey = null, ytShow = null;
const SHOW_INTRO = 'Y0r3bg8hKG4';
function renderVideoBorne(a){

  startShowPlayer(a.skipIntro ? null : (a.intro || SHOW_INTRO), a.video || '7kyY29BHTZs', a.startAt || 0, a.borneOnly);
}
function destroyShowPlayer(){ try { if (ytShow) { ytShow.destroy(); ytShow = null; } } catch(_){ ytShow = null; } }
function startShowPlayer(intro, main, startAt, autoStop){
  startAt = startAt || 0;
  if (!(window.YT && YT.Player)){
    const loop = autoStop ? '' : '&loop=1&playlist='+main;
    const src = `https://www.youtube.com/embed/${main}?autoplay=1&playsinline=1${loop}&rel=0${startAt?'&start='+startAt:''}`;
    const el = document.getElementById('ytshow');
    if (el) el.outerHTML = `<iframe width="100%" height="100%" style="border:0" src="${src}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
    return;
  }
  destroyShowPlayer();
  if (!intro){
    ytShow = new YT.Player('ytshow', {
      height:'100%', width:'100%', videoId: main,
      playerVars:{ autoplay:1, controls:0, playsinline:1, rel:0, modestbranding:1, fs:0, start: startAt },
      events:{
        onReady(e){ try{ e.target.unMute(); e.target.setVolume(100); e.target.playVideo(); }catch(_){} },
        onStateChange(e){
          if (e.data === YT.PlayerState.ENDED){
            if (autoStop) { fetch('/api/end-video', {method:'POST'}).catch(()=>{}); return; }
            try{ e.target.seekTo(startAt, true); e.target.playVideo(); }catch(_){}
          }
        }
      }
    });
    return;
  }
  ytShow = new YT.Player('ytshow', {
    height:'100%', width:'100%', videoId: intro,
    playerVars:{ autoplay:1, controls:0, playsinline:1, rel:0, modestbranding:1, fs:0 },
    events:{
      onReady(e){ try{ e.target.unMute(); e.target.setVolume(100); e.target.playVideo(); }catch(_){} },
      onStateChange(e){
        if (e.data === YT.PlayerState.ENDED){
          if (!ytShow._main){
            ytShow._main = true;
            try{ e.target.loadVideoById({videoId: main, startSeconds: startAt}); e.target.unMute(); e.target.setVolume(100); }catch(_){}
          } else {
            if (autoStop) { fetch('/api/end-video', {method:'POST'}).catch(()=>{}); return; }
            try{ e.target.seekTo(startAt, true); e.target.playVideo(); }catch(_){}
          }
        }
      }
    }
  });
}

// =================== ROUE DES GAGES (affichage borne) ===================
let roueCountTimer = null;
let roueSpinKey = null; // évite de relancer l'animation/les sons à chaque SSE
function renderRoueBorne(a){
  if (roueCountTimer){ clearInterval(roueCountTimer); roueCountTimer = null; }
  if (a.sub !== 'spin') roueSpinKey = null;
  const opts = a.options || [];
  const n = Math.max(1, opts.length);
  const COLORS = ['#ff2e88','#2effd5','#ffe600','#7a5cff','#38ff9c','#ff6b3c','#3c9cff','#c45cff'];

  // --- Phase 1 : la roue tourne et tombe sur le gage choisi ---
  if (a.sub === 'spin'){
    if (roueSpinKey === a.spinAt) return; // animation déjà en cours : ne pas la redémarrer
    roueSpinKey = a.spinAt;
    const R=140, cx=160, cy=160, seg=360/n, SPINMS=3400; // < 5 s serveur → ~1,5 s de mise en valeur du gagnant
    let paths='';
    for (let i=0;i<n;i++){
      const a0=((i)*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
      const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
      const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
      paths+=`<path id="rseg${i}" d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0,1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${COLORS[i%COLORS.length]}" stroke="#03010a" stroke-width="2"/>`;
      // étiquette : retournée si elle se retrouverait à l'envers (lisibilité)
      let rot=(i+0.5)*seg; if (rot>90 && rot<270) rot+=180;
      const am=((i+0.5)*seg-90)*Math.PI/180, lx=cx+R*0.6*Math.cos(am), ly=cy+R*0.6*Math.sin(am);
      const t=(opts[i].titre||'').slice(0,13);
      paths+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="11" fill="#03010a" text-anchor="middle" transform="rotate(${rot.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})" style="font-family:var(--term);font-weight:bold">${esc(t)}</text>`;
    }
    stage.innerHTML = `<div class="center">
      <h1 class="big neon-pink">🎰 LA ROUE DES GAGES</h1>
      <svg width="340" height="360" viewBox="0 0 320 340">
        <g id="rouewheel" style="transform-origin:160px 160px">${paths}<circle cx="160" cy="160" r="14" fill="#03010a"/></g>
        <polygon points="160,6 148,32 172,32" fill="#ffe600" stroke="#03010a" stroke-width="2"/>
      </svg>
      <p class="big neon-yellow blink" id="rouemsg">La roue tourne…</p>`;
    tickerEl.textContent = 'LA ROUE DES GAGES — qui va s\'y coller ?';
    const g=document.getElementById('rouewheel');
    if(g && g.animate){
      const center=(a.chosenIndex+0.5)*seg;
      const final=360*4 - center;
      g.animate([{transform:'rotate(0deg)'},{transform:`rotate(${final}deg)`}],
        {duration:SPINMS, easing:'cubic-bezier(.15,.7,.12,1)', fill:'forwards'});
      // cliquet : ticks de plus en plus espacés (la roue ralentit)
      if (SOUND_ON && window.SFX && SFX.tick){
        const TICKS=28;
        for (let i=0;i<TICKS;i++){
          const t = SPINMS * (1 - Math.pow(1 - i/TICKS, 2)); // ease-out
          setTimeout(()=>{ try{ SFX.tick(); }catch(_){} }, t);
        }
      }
      // atterrissage : on illumine le segment gagnant + petit « ding »
      setTimeout(()=>{
        const seg=document.getElementById('rseg'+a.chosenIndex);
        if (seg){ seg.setAttribute('stroke','#ffe600'); seg.setAttribute('stroke-width','5');
          seg.style.filter='brightness(1.7) drop-shadow(0 0 6px #ffe600)'; }
        const msg=document.getElementById('rouemsg'); if (msg){ msg.classList.remove('blink'); msg.textContent='🎯 '+((opts[a.chosenIndex]||{}).titre||''); }
        try{ if (SOUND_ON && window.SFX) SFX.coin(); }catch(_){}
      }, SPINMS + 60);
    }
    return;
  }

  const g = a.gage || {};

  // --- Phase 2 : décompte, tout le monde relève le défi ---
  if (a.sub === 'challenge'){
    const total=a.challengeSeconds||20;
    stage.innerHTML = `<div class="center glow-box">
      <div class="pill neon-yellow">🎰 DÉFI TIRÉ AU SORT</div>
      <h1 class="big neon-pink" style="margin:8px 0">${esc(g.titre||'')}</h1>
      <div class="card" style="border-color:var(--neon3);max-width:780px;margin:10px auto">
        <p class="big">${esc(g.desc||'')}</p>
        ${g.alt && g.alt!=='—' ? `<p class="muted">Variante sans alcool : ${esc(g.alt)}</p>`:''}
      </div>
      <p class="big">TOUT LE MONDE relève le défi !</p>
      <div class="huge neon-yellow" id="rouecount">${total}</div>
      <p class="muted">Le meilleur gagnera une vie ❤️ — les autres en perdront une 💔</p>`;
    tickerEl.textContent = 'RELEVEZ LE DÉFI — le meilleur gagne une vie !';
    const el=document.getElementById('rouecount');
    const tick=()=>{ const left=Math.max(0,Math.ceil(((a.challengeAt||Date.now())+total*1000-Date.now())/1000)); if(el)el.textContent=left; if(SOUND_ON&&window.SFX&&left<=5&&left>0){try{SFX.pad(0);}catch(_){}} };
    tick(); roueCountTimer=setInterval(tick,500);
    return;
  }

  // --- Phase 3 : vote « qui a été le meilleur ? » ---
  if (a.sub === 'vote'){
    const counts={}; Object.values(a.votes||{}).forEach(t=>counts[t]=(counts[t]||0)+1);
    const board=STATE.players.filter(p=>p.connected)
      .map(p=>`<div>${avatarEmoji(p.avatar)} ${esc(p.name)} <span class="neon-cyan" style="float:right">${counts[p.id]||0} ✋</span></div>`).join('');
    stage.innerHTML = `<div class="center glow-box">
      <h1 class="big neon-yellow">🗳️ QUI A ÉTÉ LE MEILLEUR ?</h1>
      <p class="big">Défi : <b class="neon-pink">${esc(g.titre||'')}</b></p>
      <p class="big neon-cyan blink">Votez sur vos téléphones !</p>
      <div class="card leaderboard" style="max-width:560px;margin:14px auto;text-align:left">${board||'<div class="muted">En attente…</div>'}</div>`;
    tickerEl.textContent = 'VOTEZ LE MEILLEUR sur vos téléphones !';
    return;
  }

  // --- Phase 4 : résultat ---
  const winners=(a.winnerIds||[]).map(id=>{const p=STATE.players.find(x=>x.id===id);return p?p.name:null;}).filter(Boolean);
  stage.innerHTML = `<div class="center glow-box">
    <h1 class="huge neon-yellow pixel">🏆 ${winners.length?esc(winners.join(' & ')):'—'}</h1>
    <p class="big">remporte une vie ❤️ pour « ${esc(g.titre||'')} » !</p>
    <p class="big neon-pink">Les autres perdent une vie 💔</p>
    <div class="mt">${scoresStrip()}</div>`;
  tickerEl.textContent = 'LA ROUE — '+(winners.join(', ')||'fin')+' !';
}

// Plan stylisé de Saint-Maur : la Marne + les sites publics remarquables.
// On NE trace PAS le parcours (c'est aux joueurs de relier les points dans
// l'ordre de leurs indices pour faire apparaître la lettre).
function enqueteMapSvg(map){
  const L = map.landmarks || [];
  const river = map.river ? `

  }).join('');

  </div>`;
}

// Bandeau de déchiffrement César : alphabet numéroté + cryptogramme.
function enqueteCipherStrip(c){
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const alpha = A.map((ch,i)=>`<span style="display:inline-block;width:30px;text-align:center;border:1px solid #ffffff22;padding:3px 0">
    <div class="neon-cyan" style="font-size:18px">${ch}</div><div class="muted" style="font-size:11px">${i+1}</div></span>`).join('');
  const crypto = (c.ciphertext||'').split('').map(ch=>`<span style="display:inline-block;width:42px;height:52px;line-height:52px;text-align:center;margin:3px;border:3px solid var(--neon);border-radius:8px;background:#1a0b2e" class="neon-yellow">${esc(ch)}</span>`).join('');
  return `<div class="card glow-box" style="text-align:center;border-color:var(--neon);margin-top:14px">
    <div class="pill neon-pink">🔐 MESSAGE CODÉ — clé : « ${esc(c.keyLetter||'?')} »</div>

}

// Détection sonore de la séquence musicale (démo, note jouée, erreur, victoire)
let _m = { demoAt: 0, step: 0, wrongAt: 0, win: false };
function detectMusic(s){
  if(!SOUND_ON || !window.SFX) return;
  const a = s.activity;
  if(!a || a.type!=='music_seq'){ _m = { demoAt:0, step:0, wrongAt:0, win:false }; return; }
  if(a.demo && a.demo.at && a.demo.at!==_m.demoAt){
    _m.demoAt = a.demo.at; let t = 0;
    // thème Mario : tempo plus vif pour qu'on le reconnaisse
    a.demo.seq.forEach(n=>{ SFX.note(n.freq, t, 0.2); t += 0.26; });
  }
  if(a.step>_m.step && a.slots[a.step-1] && a.slots[a.step-1].freq){ SFX.note(a.slots[a.step-1].freq); }
  if(a.wrongAt && a.wrongAt!==_m.wrongAt){ SFX.wrong(); }
  if(a.status==='win' && !_m.win){ SFX.win(); _m.win = true; }
  _m.step = a.step; _m.wrongAt = a.wrongAt || 0;
}

// =================== PAC-MAN (affichage borne) ===================
function pacIcon(e){ return e.role==='ghost' ? '👻' : (e.role==='mr' ? '🟡' : '🌸'); }
// Sons Pac-Man branchés au CONTEXTE : waka à chaque gomme, super-gomme,
// fantôme mangé, mort, élimination, victoire/défaite. (fichiers si présents,
// sinon recréations 8-bit — cf. SFX.pac dans sound.js)
let _pacAudio = { dots: null, fright: false, status: 'playing' };
function detectPacAudio(pm){
  if (!SOUND_ON || !window.SFX || !SFX.pac || !pm) return;
  // waka-waka : une gomme de moins → un chomp (throttlé à 1 par tick)
  if (_pacAudio.dots != null && pm.dotsLeft < _pacAudio.dots && pm.status === 'playing') SFX.pac.chomp();
  _pacAudio.dots = pm.dotsLeft;
  // super-gomme : entrée en mode fantômes bleus
  if (pm.frightened && !_pacAudio.fright) SFX.pac.power();
  _pacAudio.fright = !!pm.frightened;
  // événements transitoires (non rejoués)
  if (pm.events && pm.events.length){
    let maxAt = pacEventSeen;
    pm.events.forEach(ev=>{
      if (ev.at > pacEventSeen){
        if (ev.type === 'ghost_eaten') SFX.pac.eatGhost();
        else if (ev.type === 'pac_caught') SFX.pac.death();
        else if (ev.type === 'eliminated') SFX.pacOut();
      }
      if (ev.at > maxAt) maxAt = ev.at;
    });
    pacEventSeen = maxAt;
  }
  // fin de partie : jingle de victoire (Pac) ou de défaite
  if (pm.status !== 'playing' && _pacAudio.status === 'playing'){
    if (pm.status === 'pacwin') SFX.pac.win(); else SFX.pac.lose();
  }
  _pacAudio.status = pm.status;
}

// =================== PONG (affichage borne) ===================
function pongDraw(ctx, S, t){
  const k = S/t.size;
  ctx.fillStyle='#05010f'; ctx.fillRect(0,0,S,S);
  ctx.strokeStyle='#1b1060'; ctx.lineWidth=2; ctx.strokeRect(2,2,S-4,S-4);
  const m = t.margin*k, pad = t.pad*k;
  const sideOf = (s)=> t.players.find(p=>p.side===s);
  // murs (côtés sans joueur vivant)
  ['top','bottom','left','right'].forEach(s=>{
    const pl=sideOf(s);
    if(!pl || !pl.alive){ ctx.strokeStyle='#3a2bd0'; ctx.lineWidth=6;
      ctx.beginPath();
      if(s==='top'){ctx.moveTo(0,m);ctx.lineTo(S,m);} if(s==='bottom'){ctx.moveTo(0,S-m);ctx.lineTo(S,S-m);}
      if(s==='left'){ctx.moveTo(m,0);ctx.lineTo(m,S);} if(s==='right'){ctx.moveTo(S-m,0);ctx.lineTo(S-m,S);}
      ctx.stroke();
    }
  });
  // raquettes
  t.players.forEach(p=>{
    if(!p.alive) return;
    ctx.fillStyle=p.color; const c=p.pos*k;
    if(p.side==='top') ctx.fillRect(c-pad/2, m-3, pad, 6);
    if(p.side==='bottom') ctx.fillRect(c-pad/2, S-m-3, pad, 6);
    if(p.side==='left') ctx.fillRect(m-3, c-pad/2, 6, pad);
    if(p.side==='right') ctx.fillRect(S-m-3, c-pad/2, 6, pad);
  });
  // balle
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(t.ball.x*k, t.ball.y*k, t.ballr*k, 0, 7); ctx.fill();
}

// =================== DESSINE-MOI (affichage borne) ===================
function drawStrokes(ctx, W, H, strokes){
  ctx.fillStyle='#fdf6e3'; ctx.fillRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const s of (strokes||[])){
    const pts=s.p||[]; if(!pts.length) continue;
    ctx.strokeStyle=s.c||'#160a2e'; ctx.lineWidth=(s.w||3);
    ctx.beginPath(); ctx.moveTo(pts[0][0]*W, pts[0][1]*H);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*W, pts[i][1]*H);
    if(pts.length===1) ctx.lineTo(pts[0][0]*W+0.1, pts[0][1]*H+0.1);
    ctx.stroke();
  }
}
function wordHint(a){
  // tirets par lettre, espaces conservés ; révèle le mot à la fin
  if(a.phase==='reveal' && a.word) return esc(a.word.toUpperCase());
  return Array.from({length:a.wordLen}).map(()=>'_').join(' ');
}

// =================== DÉFI DES PIXELS (enfants, sur la borne) ===================
// Simon-says PROGRESSIF : la séquence s'allonge à chaque réussite et il faut
// atteindre une longueur cible. Plus dur (mémoire + vitesse) pour les enfants.
function buildKidsPad(){
  const d = STATE.activity.data || {};
  const startLen = d.len || 4;     // longueur de départ
  const target = d.target || 7;    // longueur à atteindre pour gagner
  // Séquence cible complète ; on en révèle de plus en plus.
  let full = Array.from({length:target}, ()=>Math.floor(Math.random()*4));
  let round = startLen;            // longueur du tour courant
  let input = [];
  let accepting = false;
  let flashDur = 360;              // plus rapide que l'ancienne version (450)

  stage.innerHTML = `
    <div class="center">
      <h1 class="big neon-yellow">👾 LE DÉFI DES PIXELS</h1>
      <p class="big" id="kidsmsg">Robin & Juliette : regardez bien les couleurs…</p>
      <p class="neon-cyan" id="kidsprog"></p>
      <div class="padgrid">
        ${[0,1,2,3].map(i=>`<div class="pad pad${i}" id="pad${i}"></div>`).join('')}
      </div>
      <button class="btn warn" style="max-width:320px;margin:0 auto" id="kidsreplay">🔁 REVOIR</button>
    </div>`;

  const msg = document.getElementById('kidsmsg');
  const prog = document.getElementById('kidsprog');
  const pads = [0,1,2,3].map(i=>document.getElementById('pad'+i));

  function flash(i, dur){
    return new Promise(r=>{
      pads[i].classList.add('lit');
      if(window.SFX) SFX.pad(i);
      setTimeout(()=>{ pads[i].classList.remove('lit'); setTimeout(r, 120); }, dur);
    });
  }
  function showProg(){ prog.textContent = `Niveau ${round - startLen + 1} — ${round} couleurs à retenir`; }
  async function playSequence(){
    accepting = false; input = [];
    showProg();
    msg.textContent = 'Regardez bien…';
    await new Promise(r=>setTimeout(r, 600));
    // accélère légèrement à mesure que ça s'allonge
    const dur = Math.max(220, flashDur - (round - startLen) * 30);
    for(let k=0;k<round;k++){ await flash(full[k], dur); }
    msg.textContent = 'À VOUS ! Refaites la suite 👆';
    accepting = true;
  }
  function win(){
    accepting = false;
    if(window.SFX) SFX.padOk();
    stage.innerHTML = `<div class="center glow-box">
      <h1 class="huge neon-yellow">👾 BRAVO LES PIXELS !</h1>
      <p class="big">Robin & Juliette ont réveillé l'Élu.</p>
      <p class="big neon-pink blink">👑 Remettez la CARTE DORÉE à Vincent !</p>
    </div>`;
    fetch('/api/kids/done',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  }
  function tap(i){
    if(!accepting) return;
    if(window.SFX) SFX.pad(i);
    pads[i].classList.add('lit'); setTimeout(()=>pads[i].classList.remove('lit'),180);
    input.push(i);
    const idx = input.length-1;
    if(input[idx]!==full[idx]){
      // erreur : on recommence le MÊME tour (sans rallonger)
      accepting = false;
      msg.textContent = 'Presque ! On recommence ce niveau… 😊';
      setTimeout(playSequence, 900);
      return;
    }
    if(input.length===round){
      // tour réussi → on rallonge, ou victoire si on atteint la cible
      if(round >= target){ win(); return; }
      accepting = false;
      round += 1;
      msg.textContent = '👍 Bien joué ! Encore une couleur de plus…';
      setTimeout(playSequence, 900);
    }
  }

  pads.forEach((p,i)=>p.addEventListener('click', ()=>tap(i)));
  document.getElementById('kidsreplay').addEventListener('click', playSequence);
  playSequence();
}

        <div style="font-size:12px;color:#aaa">${esc(p.missionLabel)}</div>

    : '<p class="big muted">Aucune photo soumise pour l\'instant…</p>';

// Récupère TOUTE la playlist rock d'un coup : getPlaylist() renvoie la liste
// complète des IDs chargés ; le serveur en tire les titres via oEmbed. Aucun
// défilement, aucune gêne pour la lecture. On retente car la liste met parfois
// 1-2 s à se peupler, et on rafraîchit (les mix radio s'allongent en jouant).
let _harvestTimer = null;
function harvestTracks(player){
  if (_harvestTimer) return;
  const grab = () => {
    let ids = [];
    try { ids = player.getPlaylist() || []; } catch(_){}
    if (ids && ids.length) {
      fetch('/api/blindtest/playlist', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ids })
      }).catch(()=>{});
    }
  };
  setTimeout(grab, 800);
  let n = 0;
  _harvestTimer = setInterval(() => { grab(); if (++n >= 12) { clearInterval(_harvestTimer); } }, 2500);
}

// =================== BLIND-TEST DYNAMIQUE ===================
// Le serveur a pioché une vidéo au hasard (a.playVideoId) : la borne la charge
// et la joue. playRequestedAt change à chaque nouvelle chanson (même id rejouable).
let _lastPlayReq = 0;
function syncBlindtest(s) {
  const a = s.activity;
  if (!a || a.type !== 'blindtest') { _lastPlayReq = 0; return; }
  if (a.playVideoId && a.playRequestedAt && a.playRequestedAt !== _lastPlayReq && a.sub === 'question') {
    _lastPlayReq = a.playRequestedAt;
    try {
      if (ytBt) { ytBt.loadVideoById(a.playVideoId); ytBt.unMute(); ytBt.playVideo(); }
      if (ytAmb) ytAmb.pauseVideo();
    } catch(_) {}
  }
}

// =================== YOUTUBE (ambiance gaming + blind-test rock + pac-man) ===================
let ytAmb = null, ytBt = null, ytPac = null, ytApiReady = false, ytInited = false;

window.onYouTubeIframeAPIReady = function(){ ytApiReady = true; initYT(); }; // démarre muet sans attendre de clic

function initYT(){
  if (ytInited || !ytApiReady) return;
  ytInited = true;
  fetch('/api/ytconfig').then(r=>r.json()).then(cfg=>{
    if (cfg.ambiance) {
      ytAmb = new YT.Player('yt-amb', {
        height:'1', width:'1',
        playerVars:{ listType:'playlist', list:cfg.ambiance, autoplay:1, loop:1, controls:0, disablekb:1, fs:0, modestbranding:1, mute:1 },
        events:{
          onReady(e){ e.target.setShuffle(true); e.target.playVideo(); }, // muet jusqu'au 1er clic
          onStateChange(e){ if(e.data===YT.PlayerState.ENDED) e.target.nextVideo(); }
        }
      });
    }
    if (cfg.blindtest) {
      ytBt = new YT.Player('yt-bt', {
        height:'1', width:'1',
        playerVars:{ listType:'playlist', list:cfg.blindtest, autoplay:1, loop:1, controls:0, disablekb:1, fs:0, modestbranding:1, mute:1 },
        events:{
          onReady(e){ e.target.setShuffle(true); e.target.mute(); e.target.playVideo(); harvestTracks(e.target); }, // muet : on moissonne les titres
          onStateChange(e){
            // Collecter le titre pour le blind-test dynamique
            if (e.data === YT.PlayerState.PLAYING) {
              try {
                const d = e.target.getVideoData();
                if (d && d.video_id && d.title) {
                  fetch('/api/blindtest/addtrack', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ videoId: d.video_id, videoTitle: d.title }),
                  }).catch(()=>{});
                }
              } catch(_) {}
            }
            if (e.data === YT.PlayerState.ENDED) e.target.nextVideo();
          }
        }
      });
    }
    if (cfg.pacman && cfg.pacman.id) {
      const pid = cfg.pacman.id, pstart = cfg.pacman.start || 0;
      ytPac = new YT.Player('yt-pac', {
        height:'1', width:'1', videoId: pid,
        playerVars:{ autoplay:1, loop:1, playlist:pid, controls:0, disablekb:1, fs:0, modestbranding:1, mute:1, start:pstart },
        events:{
          onReady(e){ e.target.mute(); }, // prêt, muet ; lancé pendant Pac-Man
          onStateChange(e){ if(e.data===YT.PlayerState.ENDED){ try{ e.target.seekTo(pstart); e.target.playVideo(); }catch(_){} } }
        }
      });
    }
  }).catch(()=>{});
}

function syncYT(s){
  const a = s.activity;
  const isBT = a && a.type === 'blindtest';
  const isPac = a && a.type === 'pacman';
  // Une chanson blind-test est posée uniquement quand le QCM est affiché.
  const songOn = isBT && a.sub === 'question' && !!a.playVideoId;
  // Diffusion vidéo : l'iframe fournit le son → on coupe tout le reste.
  if (a && a.type === 'videoshow') {
    try { if (ytAmb) ytAmb.pauseVideo(); if (ytBt) ytBt.mute(); if (ytPac) ytPac.pauseVideo(); } catch(_){}
    return;
  }
  try {
    if (isPac) {
      // 🟡 PAC-MAN : musique dédiée, ambiance et rock en pause
      if (ytPac) { ytPac.unMute(); ytPac.playVideo(); }
      if (ytAmb) ytAmb.pauseVideo();
      if (ytBt) ytBt.mute();
    } else if (songOn) {
      if (ytPac) ytPac.pauseVideo();
      if (ytBt) { ytBt.unMute(); ytBt.playVideo(); }
      if (ytAmb) ytAmb.pauseVideo();
    } else {
      if (ytPac) ytPac.pauseVideo();
      if (ytBt) ytBt.mute();
      if (ytAmb) ytAmb.playVideo();
    }
  } catch(_){}
}

// BOSS FINAL : clavier AZERTY cliquable. Ctrl+Alt+Suppr maintenus EN MÊME TEMPS
// (multi-touch sur l'iPad) → menu de redémarrage → victoire. Aucun indice du combo.
function renderBossBorne(){
  const act = STATE.activity;
  if (act.done || (act.data && act.data.rebooted)){
    bossKey = null;
    stage.innerHTML = `<div class="center"><h1 class="huge neon-yellow pixel blink">🔄 REDÉMARRAGE…</h1></div>`;
    tickerEl.textContent = 'REDÉMARRAGE DE LA RÉALITÉ…';
    return;
  }
  if (bossKey === act.startedAt) return; // déjà construit : préserve l'état multi-touch
  bossKey = act.startedAt;
  const rows = [
    ['1','2','3','4','5','6','7','8','9','0','°','+'],
    ['A','Z','E','R','T','Y','U','I','O','P','¨','£'],
    ['Q','S','D','F','G','H','J','K','L','M','%','µ'],
    ['<','W','X','C','V','B','N',',',';',':','!'],
  ];
  const K=(label,o={})=>`<button class="kkey${o.wide?' wide':''}${o.xwide?' xwide':''}"${o.k?` data-k="${o.k}"`:''}>${label}</button>`;
  stage.innerHTML = `<div class="center">
    <h1 class="big neon-pink glow-box">👾 SYSTÈME PLANTÉ</h1>
    <p class="big">La réalité est <b>FIGÉE</b>. <span class="neon-yellow">Forcez le redémarrage de l'ordinateur…</span></p>
    <div style="display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:10px">
      <div class="kbd">
        <div class="krow">${K('Échap')}${rows[0].map(c=>K(c)).join('')}${K('⌫',{wide:true})}</div>
        <div class="krow">${K('↹',{wide:true})}${rows[1].map(c=>K(c)).join('')}</div>
        <div class="krow">${K('⇪',{wide:true})}${rows[2].map(c=>K(c)).join('')}${K('⏎',{wide:true})}</div>
        <div class="krow">${K('⇧',{wide:true})}${rows[3].map(c=>K(c)).join('')}${K('⇧',{wide:true})}</div>
        <div class="krow">${K('Ctrl',{k:'CTRL'})}${K('⊞')}${K('Alt',{k:'ALT'})}${K('Espace',{xwide:true})}${K('Alt Gr',{k:'ALT'})}${K('Ctrl',{k:'CTRL'})}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${K('Inser')}${K('Suppr',{k:'SUPR'})}${K('Fin')}
      </div>
    </div>
    <div id="rebootMenu" style="display:none;position:fixed;inset:0;background:rgba(8,30,90,.97);z-index:99999;align-items:center;justify-content:center;flex-direction:column;color:#fff;padding:20px;text-align:center">
      <div style="font-family:Arial;font-size:26px;margin-bottom:14px">⚠️ Sécurité de la réalité</div>
      <div style="display:flex;flex-direction:column;gap:10px;width:min(520px,86vw)">
        <div style="background:#1133aa;padding:14px 18px;border-radius:8px;font-size:20px;opacity:.7">🔒 Verrouiller</div>
        <div style="background:#1133aa;padding:14px 18px;border-radius:8px;font-size:20px;opacity:.7">👤 Changer d'utilisateur</div>
        <div style="background:#1133aa;padding:14px 18px;border-radius:8px;font-size:20px;opacity:.7">📊 Gestionnaire des tâches</div>
        <button id="rebootBtn" style="background:#ff2e88;color:#fff;padding:18px;border:0;border-radius:10px;font-size:24px;font-weight:bold;cursor:pointer">🔄 REDÉMARRER LA RÉALITÉ</button>
      </div>
    </div>
  </div>`;
  const pressed=new Set(); let triggered=false;
  const menu=document.getElementById('rebootMenu');
  function check(){ if(!triggered && pressed.has('CTRL') && pressed.has('ALT') && pressed.has('SUPR')){ triggered=true; if(window.SFX){try{SFX.twist();}catch(_){}} menu.style.display='flex'; } }
  stage.querySelectorAll('.kkey').forEach(el=>{
    const k=el.dataset.k;
    const down=(e)=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} el.classList.add('kdown'); if(k){ pressed.add(k); check(); } };
    const up=()=>{ el.classList.remove('kdown'); if(k) pressed.delete(k); };
    el.addEventListener('pointerdown',down);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  });
  const rb=document.getElementById('rebootBtn');
  if(rb) rb.addEventListener('click',()=>{ fetch('/api/boss/reboot',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).catch(()=>{}); });
  tickerEl.textContent='BOSS FINAL — la borne est plantée…';
}
